# sz300 Helm 默认值
# 探针参数基于 v0.7.0 压测 P99=1.79ms 基线设定

replicas: 3

image:
  repository: sz300-server
  tag: "1.0.0"
  pullPolicy: IfNotPresent

rustLog: "warn,sz_rust_sz300=info"

# 探针配置
probe:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    periodSeconds: 5
    failureThreshold: 30

# 资源限制（对齐 v0.7.0 RSS 5~6MB 基线留余量）
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# 安全上下文
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# 服务配置
service:
  type: ClusterIP
  port: 80
  targetPort: 8300

# 日志 PVC
logs:
  enabled: true
  size: 5Gi
  storageClass: standard