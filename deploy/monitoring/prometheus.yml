# Prometheus 配置 - sz300-server 单机版
# 假设 sz300-server 运行在 host 的 8080 端口
# 如果端口不同，修改 targets 中的端口号

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

scrape_configs:
  # sz300-server 应用指标
  - job_name: "sz300-server"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  # Docker 主机指标（通过 cadvisor，可选）
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 30s
    scrape_timeout: 10s
