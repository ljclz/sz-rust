# Alertmanager 配置 - sz300-server 单机版
# 安全整改（2026-10-28）：所有敏感凭据通过环境变量注入，禁止硬编码。
#   smtp_auth_password → ${ALERTMANAGER_SMTP_AUTH_PASSWORD}
#   dingtalk token     → ${DINGTALK_ACCESS_TOKEN}
#   alert email        → alertmanager@localhost

global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertmanager@sz300.example.com"
  smtp_auth_username: "alertmanager@sz300.example.com"
  smtp_auth_password: "${ALERTMANAGER_SMTP_AUTH_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ["service", "severity", "category"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical-notifications"
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "warning-notifications"
      group_wait: 30s
      repeat_interval: 4h

    - match:
        severity: info
      receiver: "info-notifications"
      group_wait: 5m
      repeat_interval: 12h

receivers:
  - name: "default"
    email_configs:
      - to: "alertmanager@localhost"
        send_resolved: true

  - name: "critical-notifications"
    email_configs:
      - to: "alertmanager@localhost"
        send_resolved: true
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_ACCESS_TOKEN}"
        send_resolved: true

  - name: "warning-notifications"
    email_configs:
      - to: "alertmanager@localhost"
        send_resolved: true
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_ACCESS_TOKEN}"
        send_resolved: true

  - name: "info-notifications"
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_ACCESS_TOKEN}"
        send_resolved: true
