# Alertmanager 配置 - sz300-server 单机版
# 配置前请替换以下占位符：
#   <smtp-password>     → SMTP 密码
#   <dingtalk-token>    → 钉钉机器人 token
#   <alert-email>       → 接收告警的邮箱

global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertmanager@sz300.example.com"
  smtp_auth_username: "alertmanager@sz300.example.com"
  smtp_auth_password: "<smtp-password>"
  smtp_require_tls: true

route:
  group_by: ["service", "severity", "category"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical-notifications"
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "warning-notifications"
      group_wait: 30s
      repeat_interval: 4h

    - match:
        severity: info
      receiver: "info-notifications"
      group_wait: 5m
      repeat_interval: 12h

receivers:
  - name: "default"
    email_configs:
      - to: "<alert-email>"
        send_resolved: true

  - name: "critical-notifications"
    email_configs:
      - to: "<alert-email>"
        send_resolved: true
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=<dingtalk-token>"
        send_resolved: true

  - name: "warning-notifications"
    email_configs:
      - to: "<alert-email>"
        send_resolved: true
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=<dingtalk-token>"
        send_resolved: true

  - name: "info-notifications"
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=<dingtalk-token>"
        send_resolved: true
