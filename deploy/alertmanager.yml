# Alertmanager 配置 - sz300-server 告警路由与通知
global:
  # SMTP 配置（用于邮件告警）
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertmanager@sz300.example.com"
  smtp_auth_username: "alertmanager@sz300.example.com"
  smtp_auth_password: "alertmanager-local"
  smtp_require_tls: true

# 告警模板
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# 告警抑制规则
inhibit_rules:
  # 如果 Pod 不可用告警触发，则抑制该 Pod 的其他告警
  - source_match:
      severity: critical
      category: availability
    target_match:
      service: sz300-server
    equal: ["service"]

  # 如果 5xx 错误率告警触发，则抑制 4xx 错误率告警
  - source_match:
      severity: critical
      category: error
    target_match:
      severity: info
      category: error
    equal: ["service"]

# 告警路由
route:
  group_by: ["service", "severity", "category"]
  group_wait: 30s        # 首次告警等待 30s 聚合同组
  group_interval: 5m     # 同组告警间隔 5m
  repeat_interval: 4h    # 重复告警间隔 4h
  receiver: "default"

  routes:
  # 关键告警 -> 立即通知（邮件 + 钉钉 + PagerDuty）
  - match:
      severity: critical
    receiver: "critical-notifications"
    group_wait: 10s
    repeat_interval: 1h

  # 警告告警 -> 邮件 + 钉钉
  - match:
      severity: warning
    receiver: "warning-notifications"
    group_wait: 30s
    repeat_interval: 4h

  # 信息告警 -> 仅钉钉（不打扰）
  - match:
      severity: info
    receiver: "info-notifications"
    group_wait: 5m
    repeat_interval: 12h

# 接收器配置
receivers:
# 默认接收器（兜底）
- name: "default"
  email_configs:
  - to: "ops-team@sz300.example.com"
    send_resolved: true

# 关键告警接收器
- name: "critical-notifications"
  email_configs:
  - to: "ops-team@sz300.example.com"
    send_resolved: true
  # 钉钉 Webhook
  webhook_configs:
  - url: "https://oapi.dingtalk.com/robot/send?access_token=local-dev-token"
    send_resolved: true
  # PagerDuty（需要配置 service_key）
  pagerduty_configs:
  - service_key: "local-dev-key"
    severity: critical
    send_resolved: true

# 警告告警接收器
- name: "warning-notifications"
  email_configs:
  - to: "ops-team@sz300.example.com"
    send_resolved: true
  webhook_configs:
  - url: "https://oapi.dingtalk.com/robot/send?access_token=local-dev-token"
    send_resolved: true

# 信息告警接收器
- name: "info-notifications"
  webhook_configs:
  - url: "https://oapi.dingtalk.com/robot/send?access_token=local-dev-token"
    send_resolved: true
