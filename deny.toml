# cargo-deny 配置 — SzRSQL 项目许可证与依赖合规检查
#
# 用法：cargo deny check
# 文档：https://embarkstudios.github.io/cargo-deny/
# 适配版本：cargo-deny 0.20.x（采用 version = 2 语法，PR #611）

# =============================================================================
# 1. 许可证检查（licenses）
# =============================================================================
[licenses]
# 采用 version = 2 新语法：未在 allow 列表中的许可证自动被拒绝
version = 2
# 允许的许可证白名单（只允许开源许可证）
# 不在白名单中的许可证（含 GPL/AGPL/SSPL 等）自动被拒绝
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    # webpki-roots 使用 CDLA-Permissive-2.0（宽松数据许可，类似 MIT）
    "CDLA-Permissive-2.0",
]
# 许可证不明确时报警告（不报错）
confidence-threshold = 0.8

# =============================================================================
# 2. 漏洞公告检查（advisories）
# =============================================================================
[advisories]
# 采用 version = 2 新语法：vulnerability/unmaintained/unsound/notice 默认全部 deny
version = 2
# 已知漏洞数据库（RustSec）
# 检查频率：cargo deny check advisories
# CI 中建议每次构建都检查
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# 已被忽略的漏洞（需要明确理由）
ignore = [
    # bincode 1.x 已停止维护，但 SzRSQL 仅用于内部序列化，无安全风险
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained, used for internal serialization only" },
    # paste 1.x 已停止维护，但仅用于宏展开，无运行时风险
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, used only in proc macros" },
]

# =============================================================================
# 3. 依赖来源检查（sources）
# =============================================================================
[sources]
# 允许的 registry（仅允许 crates.io 官方源）
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 禁止未知 registry
unknown-registry = "deny"
# 禁止 Git 依赖
unknown-git = "deny"
# 允许的 Git 来源（留空表示禁止所有 Git 依赖）
allow-git = []

# =============================================================================
# 4. 禁用 crate 列表（bans）
# =============================================================================
[bans]
# 是否允许多版本共存
multiple-versions = "warn"
# 是否允许通配符依赖（workspace = true 是 workspace 依赖的标准用法，allow 不报错）
wildcards = "allow"
# 是否允许 highlight（高亮多版本冲突）
highlight = "all"
# 允许的 crate（白名单模式，留空表示不使用白名单）
allow = []
# 禁止的 crate（黑名单）
deny = [
    # 禁止使用 openssl，统一使用 rustls
    { name = "openssl", reason = "Use rustls instead of openssl for memory safety" },
    { name = "openssl-sys", reason = "Use rustls instead of openssl for memory safety" },
    # 禁止使用 chrono < 0.4.20（时区处理有 bug）
    { name = "chrono", version = "<0.4.20", reason = "Timezone handling bug fixed in 0.4.20" },
]
# 跳过的 crate（不检查）
skip = []
# 跳过的多版本冲突（树结构）
skip-tree = []
