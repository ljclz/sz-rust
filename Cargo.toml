[package]
name = "sz-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[workspace.package]
version = "1.7.0"
edition = "2021"
rust-version = "1.81"
authors = ["SZ-Rust Team"]
license = "Apache-2.0"
description = "对标 ThinkPHP 8 的 Rust Web 框架，基于 axum 0.8 + SZ-ORM"
repository = "https://github.com/ljclz/sz-rust"
homepage = "https://github.com/ljclz/sz-rust"
keywords = ["web", "framework", "thinkphp", "axum", "orm"]
categories = ["web-programming", "web-programming::http-server"]

# P1-SAFETY-01：禁止不安全代码
# 所有 workspace 成员包默认 forbid unsafe_code；
# 若个别包确需 unsafe（如 FFI、手动内存管理），在其 Cargo.toml 中单独 allow。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
askama = "0.12"
futures = "0.3"
# tokio 工具集 + CPU 核数探测
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"

# Web 框架（axum 0.8.9 + tower 0.5 + hyper 1.x）
axum = { version = "0.8", features = ["macros", "multipart", "ws", "http2"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "timeout", "fs"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"


# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
toml = "0.8"
# SIMD JSON 加速（仅 x86_64，cfg 条件依赖）
simd-json = "0.13"
# OpenAPI 文档生成
utoipa = "5"
utoipa-swagger-ui = "8"
# JWT 鉴权
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
# axum 扩展提取器
axum-extra = { version = "0.10", features = ["typed-header"] }
# gRPC 支持
tonic = "0.12"
prost = "0.13"
# GraphQL 支持（async-graphql 7.x + axum 集成）
async-graphql = "7"
async-graphql-axum = "7"
# JSON Schema 生成
schemars = "0.8"
json-patch = "3"


# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 工具
parking_lot = "0.12"
once_cell = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
# 文件监听（热重载）
notify = "6"


# HTTP 客户端
# rustls-tls-native-roots：读系统根证书库（SChannel/陕证等），内网 MITM 代理/企业自签 CA
# 场景必需；纯 rustls-tls 用 webpki-roots 内置根证书会握手失败（2026-09-04 复审修正）
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "charset", "http2"] }

# 校验
validator = { version = "0.20", features = ["derive"] }

# 文件上传
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
mime_guess = "2"
infer = "0.16"
tempfile = "3"
# 基准测试
criterion = { version = "0.5", features = ["async_tokio"] }

# 随机数（对齐 PHP rand(0, 9999)）
rand = "0.8"

# Redis 客户端（对齐 PHP think-orm/think-cache Redis 驱动）
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }

# 系统信息（admin monitor API：CPU/内存/磁盘/负载）
sysinfo = "0.32"

# 图像处理（对齐 PHP Grafika\Gd\Editor + Image + Color + Position）
# P0-2: 禁用 exr feature 消除 paste(unmaintained) 传递依赖链 image→exr→pulp→paste
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "rayon"] }
# P0-2: imageproc 0.25→0.27，default-features=false 避免强制 image/default（含 exr→paste）
imageproc = { version = "0.27", default-features = false, features = ["text", "rayon"] }
ab_glyph = "0.2"

# 二维码生成（对齐 PHP endroid/qr-code）
qrcode = "0.14"

# Excel/PDF 处理（对齐 PHP phpspreadsheet + mikehaertl/php-pdftk）
rust_xlsxwriter = "0.79"
calamine = { version = "0.36", features = ["dates"] }
# P0-2: lopdf 0.42→0.44 消除 ttf-parser(unmaintained) 传递依赖
lopdf = "0.44"

# 加密
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# 过程宏
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# 属性测试（Fuzz 测试深度提升，提供 shrinking 能力）
proptest = "1"

# 内部依赖（SZ-ORM 全家桶，从 crates.io 拉取）
# 2026-09-26 全量对齐 9.0.0（sz-orm v9.0.0 覆盖率战役交付）
sz-orm-core = "9.4.0"
sz-orm-auth = "9.4.0"
sz-orm-storage = "9.4.0"
sz-orm-queue = "9.4.0"
sz-orm-mqtt = "9.4.0"
sz-orm-websocket = "9.4.0"
sz-orm-scheduler = "9.4.0"
sz-orm-tracing = "9.4.0"
sz-orm-logger = "9.4.0"
sz-orm-limit = "9.4.0"
sz-orm-config = "9.4.0"
sz-orm-macros = "9.4.0"
sz-orm-sql-validator = "9.4.0"
sz-orm-sqlx = "9.4.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid"] }
sz-orm-query-builder = "9.4.0"
sz-orm-graphql = "9.4.0"
sz-orm-grpc = "9.4.0"

# 内部依赖（SZ-Rust 自身）
sz-rust-core = { version = "1.4.0", path = "packages/sz-rust-core" }
sz-rust-orm-facade = { version = "1.4.0", path = "packages/sz-rust-orm-facade" }
sz-rust-http-facade = { version = "1.4.0", path = "packages/sz-rust-http-facade" }
sz-rust-cache-facade = { version = "1.4.0", path = "packages/sz-rust-cache-facade" }
sz-rust-state-facade = { version = "1.4.0", path = "packages/sz-rust-state-facade" }
sz-rust-infra-facade = { version = "1.4.0", path = "packages/sz-rust-infra-facade" }
sz-rust-auth-facade = { version = "1.4.0", path = "packages/sz-rust-auth-facade" }
sz-rust-pay-facade = { version = "1.4.0", path = "packages/sz-rust-pay-facade" }
sz-rust-orm-ext-facade = { version = "1.4.0", path = "packages/sz-rust-orm-ext-facade" }
sz-rust-router-facade = { version = "1.4.0", path = "packages/sz-rust-router-facade" }
sz-rust-middleware-facade = { version = "1.4.0", path = "packages/sz-rust-middleware-facade" }
sz-rust-mvc-facade = { version = "1.4.0", path = "packages/sz-rust-mvc-facade" }
sz-rust-mcp = { version = "1.4.0", path = "packages/sz-rust-mcp" }
sz-rust-macros = { version = "1.4.0", path = "packages/sz-rust-macros" }
sz-rust-addons-loader = { version = "1.4.0", path = "packages/sz-rust-addons-loader" }
sz-rust-observability = { version = "1.4.0", path = "packages/sz-rust-observability" }
sz-rust-cli = { version = "1.4.0", path = "packages/sz-rust-cli" }
sz-rust-ai-facade = { version = "1.4.0", path = "packages/sz-rust-ai-facade" }
sz-rust-capability = { version = "1.4.0", path = "packages/sz-rust-capability" }
sz-rust-rag = { version = "1.4.0", path = "packages/sz-rust-rag" }
sz-rust-frontend-codegen = { version = "1.4.0", path = "packages/sz-rust-frontend-codegen" }
sz-rust-tracing = { version = "1.4.0", path = "packages/sz-rust-tracing" }
sz-rust-pdf = { version = "1.4.0", path = "packages/sz-rust-pdf" }
sz-rust-workflow = { version = "1.4.0", path = "packages/sz-rust-workflow" }
sz-rust-wasm = { version = "1.4.0", path = "packages/sz-rust-wasm" }
sz-rust-vector-db = { version = "1.4.0", path = "packages/sz-rust-vector-db" }
sz-rust-marketplace = { version = "1.4.0", path = "packages/sz-rust-marketplace" }
sz-rust-visual = { version = "1.4.0", path = "packages/sz-rust-visual" }
sz-rust-addons-admin = { version = "1.4.0", path = "packages/sz-rust-addons-admin" }
sz-rust-facade = { version = "1.4.0", path = "packages/sz-rust-facade" }
sz-rust-config-center = { version = "1.4.0", path = "packages/sz-rust-config-center" }
sz-rust-service-registry = { version = "1.4.0", path = "packages/sz-rust-service-registry" }
sz-rust-distributed-tx = { version = "1.4.0", path = "packages/sz-rust-distributed-tx" }
sz-rust-api-gateway = { version = "1.4.0", path = "packages/sz-rust-api-gateway" }
sz-rust-ops-api = { version = "1.4.0", path = "packages/sz-rust-ops-api" }
sz-rust-sz300 = { version = "1.4.0", path = "packages/sz-rust-sz300" }

# v1.7.0 新增 crate
sz-rust-i18n = { version = "1.7.0", path = "packages/sz-rust-i18n" }
sz-rust-plugin-sdk = { version = "1.7.0", path = "packages/sz-rust-plugin-sdk" }
sz-rust-pipeline = { version = "1.7.0", path = "packages/sz-rust-pipeline" }
sz-rust-zerocopy = { version = "1.7.0", path = "packages/sz-rust-zerocopy" }
sz-rust-benchmark-suite = { version = "1.7.0", path = "packages/sz-rust-benchmark-suite" }
sz-rust-alert-engine = { version = "1.7.0", path = "packages/sz-rust-alert-engine" }
sz-rust-log-aggregator = { version = "1.7.0", path = "packages/sz-rust-log-aggregator" }
sz-rust-data-mask = { version = "1.7.0", path = "packages/sz-rust-data-mask" }
sz-rust-key-rotation = { version = "1.7.0", path = "packages/sz-rust-key-rotation" }
sz-rust-security-headers = { version = "1.7.0", path = "packages/sz-rust-security-headers" }
sz-rust-websocket = { version = "1.7.0", path = "packages/sz-rust-websocket" }
sz-rust-upload = { version = "1.7.0", path = "packages/sz-rust-upload" }
sz-rust-admin-ui = { version = "1.7.0", path = "packages/sz-rust-admin-ui" }
sz-rust-monitor-panel = { version = "1.7.0", path = "packages/sz-rust-monitor-panel" }
sz-rust-codegen-ui = { version = "1.7.0", path = "packages/sz-rust-codegen-ui" }

# 密码哈希（sz300 业务应用）
bcrypt = "0.16"


# Ed25519 签名（P3-T2 插件市场）
ed25519-dalek = "2"
# 语义化版本（P3-T2 插件市场）
semver = { version = "1", features = ["serde"] }
# JSON Schema 校验（P3-T2 插件清单）
jsonschema = "0.18"
# CLI 表格输出（P3-T2 插件市场 CLI）
tabled = "0.16"
# CLI 进度条（P3-T2 插件市场 CLI）
indicatif = "0.17"
# 压缩与归档（P3-T2 插件包）
flate2 = "1"
tar = "0.4"
zip = "0.6"

# Tauri 2.x 桌面应用框架（P3-T1 可视化画布）
tauri = "2"
tauri-build = "2"

# 无锁原子替换（AI 路由表热更新）
arc-swap = "1"

# IP CIDR 解析（安全中间件 IP 访问控制）
ipnet = "2"

# 命令行 + 调度器
clap = { version = "4.5", features = ["derive"] }

# 模板引擎（P1-T3 插件模板库）
tera = "1.20"
# 交互式命令行输入（P1-T3 插件模板库）
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# ── v1.7.0 新增外部依赖 ──
rkyv = "0.8"
zerocopy = "0.8"
dashmap = "6"

# ── Feature Gate 细化（v1.4.0 T02）──
# 细粒度 feature 实现按需编译，聚合 feature 向后兼容

[features]
default = []

# === AI 能力 ===
# AI 推理 facade（LLM 路由、fallback、provider 抽象）
ai-facade = ["dep:sz-rust-ai-facade"]
# RAG 检索增强生成（向量存储 + 文档分块 + 语义检索）
ai-rag = ["ai-facade", "dep:sz-rust-rag"]
# 前端代码生成（AI 驱动的 Vue/React 代码生成）
ai-codegen = ["ai-facade", "dep:sz-rust-frontend-codegen"]

# === ORM 扩展 ===
# GraphQL 查询接口（async-graphql 集成）
orm-graphql = ["dep:sz-rust-orm-facade", "sz-rust-orm-facade/graphql"]
# gRPC 查询接口（tonic 集成）
orm-grpc = ["dep:sz-rust-orm-facade", "sz-rust-orm-facade/grpc"]

# === 微服务 ===
# 服务注册与发现
service-registry = ["dep:sz-rust-service-registry"]
# 分布式事务
distributed-tx = ["dep:sz-rust-distributed-tx"]
# API 网关
api-gateway = ["dep:sz-rust-api-gateway"]
# 配置中心
config-center = ["dep:sz-rust-config-center"]

# === 可观测性 ===
# 分布式追踪
tracing = ["dep:sz-rust-tracing"]
# 监控指标
observability = ["dep:sz-rust-observability"]

# === 边缘计算 ===
# WASM 边缘计算运行时
wasm = ["dep:sz-rust-wasm"]

# === 聚合 feature（向后兼容，组合细粒度 feature）===
# P2 插件扩展（ORM GraphQL + gRPC）
p2-addons = ["orm-graphql", "orm-grpc"]
# P3 微服务全家桶
p3-microservices = ["service-registry", "distributed-tx", "api-gateway", "config-center"]
# P3 AI 全家桶
p3-ai = ["ai-rag", "ai-codegen"]
# P3 边缘计算
p3-edge = ["wasm"]

# === 互斥 feature 声明 ===
# Cargo 不支持显式互斥声明，以下组合通过 CI 脚本检查：
# 互斥组 1：TLS 后端（rustls vs native-tls）— 当前仅 rustls，预留扩展
# 互斥组 2：数据库后端（backend-mysql / backend-postgres / backend-sqlite / backend-oracle / backend-mssql）

# === v1.7.0 全栈能力跃升 ===
# 方向1：插件生态与扩展性
plugin-market = ["dep:sz-rust-marketplace"]
plugin-hot-reload = ["dep:sz-rust-addons-loader"]
plugin-theme = ["dep:sz-rust-frontend-codegen"]
plugin-i18n = ["dep:sz-rust-i18n"]
plugin-sdk = ["dep:sz-rust-plugin-sdk"]
# 方向2：性能优化与基准
perf-pool = ["dep:sz-rust-orm-facade"]
perf-query-cache = ["dep:sz-rust-orm-facade"]
perf-pipeline = ["dep:sz-rust-pipeline"]
perf-zerocopy = ["dep:sz-rust-zerocopy"]
perf-benchmark = ["dep:sz-rust-benchmark-suite"]
# 方向3：可观测性深化
obs-otel-fullchain = ["dep:sz-rust-observability"]
obs-alert-engine = ["dep:sz-rust-alert-engine"]
obs-log-aggregator = ["dep:sz-rust-log-aggregator"]
obs-health-probe = ["dep:sz-rust-observability"]
# 方向4：安全合规加固
sec-rbac = ["dep:sz-rust-auth-facade"]
sec-data-mask = ["dep:sz-rust-data-mask"]
sec-audit = ["dep:sz-rust-auth-facade"]
sec-key-rotation = ["dep:sz-rust-key-rotation"]
sec-security-headers = ["dep:sz-rust-security-headers"]
# 方向5：API 协议扩展
api-graphql = ["dep:sz-rust-orm-facade"]
api-websocket = ["dep:sz-rust-websocket"]
api-sse = ["dep:sz-rust-http-facade"]
api-upload = ["dep:sz-rust-upload"]
# 方向6：前端与可视化
frontend-tauri = ["dep:sz-rust-visual"]
frontend-admin-ui = ["dep:sz-rust-admin-ui"]
frontend-monitor-panel = ["dep:sz-rust-monitor-panel"]
frontend-codegen-ui = ["dep:sz-rust-codegen-ui"]

# v1.7.0 方向聚合 feature
d1-plugin-ecosystem = ["plugin-market", "plugin-hot-reload", "plugin-theme", "plugin-i18n", "plugin-sdk"]
d2-performance = ["perf-pool", "perf-query-cache", "perf-pipeline", "perf-zerocopy", "perf-benchmark"]
d3-observability = ["obs-otel-fullchain", "obs-alert-engine", "obs-log-aggregator", "obs-health-probe"]
d4-security = ["sec-rbac", "sec-data-mask", "sec-audit", "sec-key-rotation", "sec-security-headers"]
d5-api-protocol = ["api-graphql", "api-websocket", "api-sse", "api-upload"]
d6-frontend = ["frontend-tauri", "frontend-admin-ui", "frontend-monitor-panel", "frontend-codegen-ui"]
all-v1-7 = ["d1-plugin-ecosystem", "d2-performance", "d3-observability", "d4-security", "d5-api-protocol", "d6-frontend"]

