[workspace]
resolver = "2"
members = [
    "packages/sz-rust-core",
    "packages/sz-rust-http-facade",
    "packages/sz-rust-cache-facade",
    "packages/sz-rust-state-facade",
    "packages/sz-rust-infra-facade",
    "packages/sz-rust-auth-facade",
    "packages/sz-rust-pay-facade",
    "packages/sz-rust-orm-facade",
    "packages/sz-rust-orm-ext-facade",
    "packages/sz-rust-router-facade",
    "packages/sz-rust-middleware-facade",
    "packages/sz-rust-mvc-facade",
    "packages/sz-rust-mcp",
    "packages/sz-rust-facade-tests",
    "packages/sz-rust-macros",
    "packages/sz-rust-examples",
    "packages/sz-rust-examples/addon-hot-reload-example",
    "packages/sz-rust-addons-loader",
    "packages/sz-rust-addons-crm",
    "packages/sz-rust-addons-ecommerce",
    "packages/sz-rust-addons-cms",
    "packages/sz-rust-cli",
    "packages/sz-rust-observability",
    "packages/sz-rust-sz300",

    "packages/sz-rust-ai-facade",
    "packages/sz-rust-capability",
    "packages/sz-rust-rag",
    "packages/sz-rust-frontend-codegen",

    "packages/sz-rust-tracing",
    "packages/sz-rust-pdf",
    "packages/sz-rust-workflow",
    "packages/sz-rust-addons-operate",
    "packages/sz-rust-addons-erp",
    "packages/sz-rust-addons-forum",
    "packages/sz-rust-addons-im",
    "packages/sz-rust-wasm",
    "packages/sz-rust-k8s-operator",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["SZ-Rust Team"]
license = "MIT"
description = "对标 ThinkPHP 8 的 Rust Web 框架，基于 axum 0.8 + SZ-ORM"
repository = "https://github.com/ljclz/sz-rust"
homepage = "https://github.com/ljclz/sz-rust"
keywords = ["web", "framework", "thinkphp", "axum", "orm"]
categories = ["web-programming", "web-programming::http-server"]

# P1-SAFETY-01：禁止不安全代码
# 所有 workspace 成员包默认 forbid unsafe_code；
# 若个别包确需 unsafe（如 FFI、手动内存管理），在其 Cargo.toml 中单独 allow。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
# tokio 工具集 + CPU 核数探测
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"

# Web 框架（axum 0.8.9 + tower 0.5 + hyper 1.x）
axum = { version = "0.8", features = ["macros", "multipart", "ws", "http2"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "timeout", "fs"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"


# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
toml = "0.8"
# SIMD JSON 加速（仅 x86_64，cfg 条件依赖）
simd-json = "0.13"
# OpenAPI 文档生成
utoipa = "5"
utoipa-swagger-ui = "8"
# gRPC 支持
tonic = "0.12"
prost = "0.13"
# GraphQL 支持（async-graphql 7.x + axum 集成）
async-graphql = "7"
async-graphql-axum = "7"
# K8s Operator 支持（kube + schemars for CRD）
kube = { version = "0.96", features = ["runtime", "derive", "client"] }
kube-derive = "0.96"
schemars = "0.8"
# K8s API 类型（kube 依赖）
k8s-openapi = { version = "0.23", features = ["latest"] }
# JSON Schema 生成（kube CRD 需要）
json-patch = "3"


# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 工具
parking_lot = "0.12"
once_cell = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
# 文件监听（热重载）
notify = "6"


# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }

# 校验
validator = { version = "0.20", features = ["derive"] }

# 文件上传
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
mime_guess = "2"
infer = "0.16"
tempfile = "3"
# 基准测试
criterion = { version = "0.5", features = ["async_tokio"] }

# 随机数（对齐 PHP rand(0, 9999)）
rand = "0.8"

# Redis 客户端（对齐 PHP think-orm/think-cache Redis 驱动）
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }

# 系统信息（admin monitor API：CPU/内存/磁盘/负载）
sysinfo = "0.32"

# 图像处理（对齐 PHP Grafika\Gd\Editor + Image + Color + Position）
# P0-2: 禁用 exr feature 消除 paste(unmaintained) 传递依赖链 image→exr→pulp→paste
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "rayon"] }
# P0-2: imageproc 0.25→0.27，default-features=false 避免强制 image/default（含 exr→paste）
imageproc = { version = "0.27", default-features = false, features = ["text", "rayon"] }
ab_glyph = "0.2"

# 二维码生成（对齐 PHP endroid/qr-code）
qrcode = "0.14"

# Excel/PDF 处理（对齐 PHP phpspreadsheet + mikehaertl/php-pdftk）
rust_xlsxwriter = "0.79"
calamine = { version = "0.36", features = ["dates"] }
# P0-2: lopdf 0.42→0.44 消除 ttf-parser(unmaintained) 传递依赖
lopdf = "0.44"

# 加密
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# 过程宏
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# 属性测试（Fuzz 测试深度提升，提供 shrinking 能力）
proptest = "1"

# 内部依赖（SZ-ORM 全家桶，从 crates.io 4.9.0 拉取）
sz-orm-core = "4.9.0"
sz-orm-auth = "4.9.0"
sz-orm-storage = "4.9.0"
sz-orm-queue = "4.9.0"
sz-orm-mqtt = "4.9.0"
sz-orm-websocket = "4.9.1"
sz-orm-scheduler = "4.9.0"
sz-orm-tracing = "4.9.0"
sz-orm-logger = "4.9.0"
sz-orm-limit = "4.9.0"
sz-orm-config = "4.9.0"
sz-orm-macros = "4.9.0"
sz-orm-sql-validator = "4.9.0"
sz-orm-sqlx = "4.9.0"
sz-orm-query-builder = "4.9.0"
sz-orm-graphql = "4.9.0"
sz-orm-grpc = "4.9.0"

# 内部依赖（SZ-Rust 自身）
sz-rust-core = { version = "1.1.0", path = "packages/sz-rust-core" }
sz-rust-orm-facade = { version = "1.1.0", path = "packages/sz-rust-orm-facade" }
sz-rust-http-facade = { version = "1.1.0", path = "packages/sz-rust-http-facade" }
sz-rust-cache-facade = { version = "1.1.0", path = "packages/sz-rust-cache-facade" }
sz-rust-state-facade = { version = "1.1.0", path = "packages/sz-rust-state-facade" }
sz-rust-infra-facade = { version = "1.1.0", path = "packages/sz-rust-infra-facade" }
sz-rust-auth-facade = { version = "1.1.0", path = "packages/sz-rust-auth-facade" }
sz-rust-pay-facade = { version = "1.1.0", path = "packages/sz-rust-pay-facade" }
sz-rust-orm-ext-facade = { version = "1.1.0", path = "packages/sz-rust-orm-ext-facade" }
sz-rust-router-facade = { version = "1.1.0", path = "packages/sz-rust-router-facade" }
sz-rust-middleware-facade = { version = "1.1.0", path = "packages/sz-rust-middleware-facade" }
sz-rust-mvc-facade = { version = "1.1.0", path = "packages/sz-rust-mvc-facade" }
sz-rust-mcp = { version = "1.1.0", path = "packages/sz-rust-mcp" }
sz-rust-macros = { version = "1.1.0", path = "packages/sz-rust-macros" }
sz-rust-addons-loader = { version = "1.1.0", path = "packages/sz-rust-addons-loader" }
sz-rust-observability = { version = "1.1.0", path = "packages/sz-rust-observability" }
sz-rust-cli = { version = "1.1.0", path = "packages/sz-rust-cli" }
sz-rust-ai-facade = { version = "1.1.0", path = "packages/sz-rust-ai-facade" }
sz-rust-capability = { version = "1.1.0", path = "packages/sz-rust-capability" }
sz-rust-addons-cms = { version = "1.1.0", path = "packages/sz-rust-addons-cms" }
sz-rust-addons-crm = { version = "1.1.0", path = "packages/sz-rust-addons-crm" }
sz-rust-addons-ecommerce = { version = "1.1.0", path = "packages/sz-rust-addons-ecommerce" }
sz-rust-rag = { version = "1.1.0", path = "packages/sz-rust-rag" }
sz-rust-frontend-codegen = { version = "1.1.0", path = "packages/sz-rust-frontend-codegen" }
sz-rust-tracing = { version = "1.1.0", path = "packages/sz-rust-tracing" }
sz-rust-pdf = { version = "1.1.0", path = "packages/sz-rust-pdf" }
sz-rust-workflow = { version = "1.1.0", path = "packages/sz-rust-workflow" }
sz-rust-addons-operate = { version = "1.1.0", path = "packages/sz-rust-addons-operate" }
sz-rust-addons-erp = { version = "1.1.0", path = "packages/sz-rust-addons-erp" }
sz-rust-addons-forum = { version = "1.1.0", path = "packages/sz-rust-addons-forum" }
sz-rust-addons-im = { version = "1.1.0", path = "packages/sz-rust-addons-im" }
sz-rust-wasm = { version = "1.1.0", path = "packages/sz-rust-wasm" }
sz-rust-k8s-operator = { version = "1.1.0", path = "packages/sz-rust-k8s-operator" }

# Ed25519 签名（P3-T2 插件市场）
ed25519-dalek = "2"
# 语义化版本（P3-T2 插件市场）
semver = { version = "1", features = ["serde"] }
# JSON Schema 校验（P3-T2 插件清单）
jsonschema = "0.18"
# CLI 表格输出（P3-T2 插件市场 CLI）
tabled = "0.16"
# CLI 进度条（P3-T2 插件市场 CLI）
indicatif = "0.17"
# 压缩与归档（P3-T2 插件包）
flate2 = "1"
tar = "0.4"
zip = "0.6"

# Tauri 2.x 桌面应用框架（P3-T1 可视化画布）
tauri = "2"
tauri-build = "2"

# 无锁原子替换（AI 路由表热更新）
arc-swap = "1"

# IP CIDR 解析（安全中间件 IP 访问控制）
ipnet = "2"

# 命令行 + 调度器
clap = { version = "4.5", features = ["derive"] }

# 模板引擎（P1-T3 插件模板库）
tera = "1.20"
# 交互式命令行输入（P1-T3 插件模板库）
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# ── 构建优化配置 ──

[profile.dev]
opt-level = 0
debug = true
# 启用算术溢出检查（开发期也需 fail-fast，与 release 一致，铁律 1）
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# 启用算术溢出检查（生产安全要求：溢出属于未定义行为，应 fail-fast 而非静默回绕）
overflow-checks = true
