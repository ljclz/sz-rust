[workspace]
resolver = "2"
members = [
    "packages/sz-rust-core",
    "packages/sz-rust-http-facade",
    "packages/sz-rust-cache-facade",
    "packages/sz-rust-state-facade",
    "packages/sz-rust-infra-facade",
    "packages/sz-rust-auth-facade",
    "packages/sz-rust-pay-facade",
    "packages/sz-rust-orm-facade",
    "packages/sz-rust-orm-ext-facade",
    "packages/sz-rust-router-facade",
    "packages/sz-rust-middleware-facade",
    "packages/sz-rust-mvc-facade",
    "packages/sz-rust-mcp",
    "packages/sz-rust-facade-tests",
    "packages/sz-rust-macros",
    "packages/sz-rust-examples",
    "packages/sz-rust-examples/addon-hot-reload-example",
    "packages/sz-rust-addons-loader",
    "packages/sz-rust-addons-operate",
    "packages/sz-rust-addons-crm",
    "packages/sz-rust-addons-erp",
    "packages/sz-rust-addons-ecommerce",
    "packages/sz-rust-pdf",
    "packages/sz-rust-cli",
    "packages/sz-rust-tracing",
    "packages/sz-rust-observability",
    "packages/sz-rust-sz300",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
authors = ["SZ-Rust Team"]
license = "MIT"
description = "对标 ThinkPHP 8 的 Rust Web 框架，基于 axum 0.8 + SZ-ORM"
repository = "https://github.com/ljclz/sz-rust"
homepage = "https://github.com/ljclz/sz-rust"
keywords = ["web", "framework", "thinkphp", "axum", "orm"]
categories = ["web-programming", "web-programming::http-server"]

# P1-SAFETY-01：禁止不安全代码
# 所有 workspace 成员包默认 forbid unsafe_code；
# 若个别包确需 unsafe（如 FFI、手动内存管理），在其 Cargo.toml 中单独 allow。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
# tokio 工具集 + CPU 核数探测
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"

# Web 框架（axum 0.8.9 + tower 0.5 + hyper 1.x）
axum = { version = "0.8", features = ["macros", "multipart", "ws", "http2"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "timeout", "fs"] }
hyper = "1"
http = "1"
http-body-util = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
toml = "0.8"

# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 工具
parking_lot = "0.12"
once_cell = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
indexmap = { version = "2", features = ["serde"] }

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }

# 校验
validator = { version = "0.20", features = ["derive"] }

# 文件上传
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
mime_guess = "2"
infer = "0.16"
tempfile = "3"

# 随机数（对齐 PHP rand(0, 9999)）
rand = "0.8"

# 图像处理（对齐 PHP Grafika\Gd\Editor + Image + Color + Position）
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# 二维码生成（对齐 PHP endroid/qr-code）
qrcode = "0.14"

# Excel/PDF 处理（对齐 PHP phpspreadsheet + mikehaertl/php-pdftk）
rust_xlsxwriter = "0.79"
calamine = { version = "0.36", features = ["dates"] }
lopdf = "0.42"

# 加密
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# 过程宏
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# 属性测试（Fuzz 测试深度提升，提供 shrinking 能力）
proptest = "1"

# 内部依赖（SZ-ORM 全家桶，path + version 双重指定：本地开发用 path，crates.io 发布用 version）
sz-orm-core = { path = "../sz-orm/packages/sz-orm-core", version = "1.2.2" }
sz-orm-auth = { path = "../sz-orm/packages/sz-orm-auth", version = "1.2.2" }
sz-orm-storage = { path = "../sz-orm/packages/sz-orm-storage", version = "1.2.2" }
sz-orm-queue = { path = "../sz-orm/packages/sz-orm-queue", version = "1.2.2" }
sz-orm-mqtt = { path = "../sz-orm/packages/sz-orm-mqtt", version = "1.2.2" }
sz-orm-websocket = { path = "../sz-orm/packages/sz-orm-websocket", version = "1.2.2" }
sz-orm-scheduler = { path = "../sz-orm/packages/sz-orm-scheduler", version = "1.2.2" }
sz-orm-tracing = { path = "../sz-orm/packages/sz-orm-tracing", version = "1.2.2" }
sz-orm-logger = { path = "../sz-orm/packages/sz-orm-logger", version = "1.2.2" }
sz-orm-limit = { path = "../sz-orm/packages/sz-orm-limit", version = "1.2.2" }
sz-orm-config = { path = "../sz-orm/packages/sz-orm-config", version = "1.2.2" }
sz-orm-macros = { path = "../sz-orm/packages/sz-orm-macros", version = "1.2.2" }
sz-orm-sql-validator = { path = "../sz-orm/packages/sz-orm-sql-validator", version = "1.2.2" }
sz-orm-sqlx = { path = "../sz-orm/packages/sz-orm-sqlx", version = "1.2.2" }
sz-orm-query-builder = { path = "../sz-orm/packages/sz-orm-query-builder", version = "1.2.2" }
sz-orm-graphql = { path = "../sz-orm/packages/sz-orm-graphql", version = "1.2.2" }
sz-orm-grpc = { path = "../sz-orm/packages/sz-orm-grpc", version = "1.2.2" }

# 内部依赖（SZ-Rust 自身）
sz-rust-core = { version = "0.3.0", path = "packages/sz-rust-core" }
sz-rust-orm-facade = { version = "0.3.0", path = "packages/sz-rust-orm-facade" }
sz-rust-http-facade = { version = "0.3.0", path = "packages/sz-rust-http-facade" }
sz-rust-cache-facade = { version = "0.3.0", path = "packages/sz-rust-cache-facade" }
sz-rust-state-facade = { version = "0.3.0", path = "packages/sz-rust-state-facade" }
sz-rust-infra-facade = { version = "0.3.0", path = "packages/sz-rust-infra-facade" }
sz-rust-auth-facade = { version = "0.3.0", path = "packages/sz-rust-auth-facade" }
sz-rust-pay-facade = { version = "0.3.0", path = "packages/sz-rust-pay-facade" }
sz-rust-orm-ext-facade = { version = "0.3.0", path = "packages/sz-rust-orm-ext-facade" }
sz-rust-router-facade = { version = "0.3.0", path = "packages/sz-rust-router-facade" }
sz-rust-middleware-facade = { version = "0.3.0", path = "packages/sz-rust-middleware-facade" }
sz-rust-mvc-facade = { version = "0.3.0", path = "packages/sz-rust-mvc-facade" }
sz-rust-mcp = { version = "0.3.0", path = "packages/sz-rust-mcp" }
sz-rust-macros = { version = "0.3.0", path = "packages/sz-rust-macros" }
sz-rust-addons-loader = { version = "0.3.0", path = "packages/sz-rust-addons-loader" }
sz-rust-pdf = { version = "0.3.0", path = "packages/sz-rust-pdf" }
sz-rust-tracing = { version = "0.3.0", path = "packages/sz-rust-tracing" }
sz-rust-observability = { version = "0.3.0", path = "packages/sz-rust-observability" }
sz-rust-cli = { version = "0.3.0", path = "packages/sz-rust-cli" }

# 命令行 + 调度器
clap = { version = "4.5", features = ["derive"] }

# ── 构建优化配置 ──

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# 启用算术溢出检查（生产安全要求：溢出属于未定义行为，应 fail-fast 而非静默回绕）
overflow-checks = true
