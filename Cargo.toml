[workspace]
resolver = "2"
members = [
    "crates/szrsql-types",
    "crates/szrsql-storage",
    "crates/szrsql-tx",
    "crates/szrsql-cdc",
    "crates/szrsql-sql",
    "crates/szrsql-catalog",
    "crates/szrsql-protocol",
    "crates/szrsql-optimizer",
    "crates/szrsql-ai",
    "crates/szrsql-security",
    "crates/szrsql-scheduler",
    "crates/szrsql-replication",
    "crates/szrsql-dist",
    "crates/szrsql-pgcompat",
    "crates/szrsql-ops",
    "crates/szrsql-shadow",
    "crates/szrsql-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SzRSQL Team"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
bytes = "1"
crc32c = "0.6"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
# Phase 7c.1：TDE 透明加密（AES-256-CTR）
aes = "0.8"
cipher = "0.4"
# Phase 7c.4：列级加密（AES-256-GCM 认证加密）
aes-gcm = "0.10"
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"

# Phase 4.13：进程守护化 + PID 文件
# Unix：libc 提供 fork/setsid/kill 等系统调用
libc = "0.2"
# Windows：windows-sys 提供 OpenProcess 等系统调用（用于检测进程是否存活）
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

# Phase 4.5：TLS 1.3 加密（rustls 集成）
# 使用 ring 作为 crypto provider（在 Windows 上构建更可靠，无需 cmake）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Phase 7d.19：WAL 高级特性（zstd 压缩）
zstd = "0.13"

# Phase 7f.1：外部列存格式（Arrow IPC / Parquet / CSV / JSONLines）
arrow = { version = "59", default-features = false, features = ["csv", "ipc", "json"] }
parquet = { version = "59", default-features = false, features = ["arrow"] }

# Phase 7f.2：远程文件系统（S3 / HTTPFS）
ureq = { version = "2", default-features = false, features = ["tls"] }

# SQL 解析器
sqlparser = "0.53"

# 正则表达式（用于 LIKE 模式匹配）
regex = "1"

# 测试依赖（property-based testing）
proptest = "1"

# 测试依赖（Phase 4.5：自签名证书生成，用于 TLS 集成测试）
rcgen = "0.13"

# ========== 对抗性测试 dev-dependencies（Phase F-9+） ==========
# 变异测试
loom = { version = "0.7", features = ["checkpoint"] }
arbitrary = { version = "1.3", features = ["derive"] }
rstest = "0.19"
tempfile = "3.10"
tracing-test = "0.2"
fakefs = "0.3"
predicates = "3.1"

# 内部 crate 依赖
szrsql-types = { path = "crates/szrsql-types" }
szrsql-storage = { path = "crates/szrsql-storage" }
szrsql-tx = { path = "crates/szrsql-tx" }
szrsql-cdc = { path = "crates/szrsql-cdc" }
szrsql-sql = { path = "crates/szrsql-sql" }
szrsql-catalog = { path = "crates/szrsql-catalog" }
szrsql-protocol = { path = "crates/szrsql-protocol" }
szrsql-optimizer = { path = "crates/szrsql-optimizer" }
szrsql-ai = { path = "crates/szrsql-ai" }
szrsql-security = { path = "crates/szrsql-security" }
szrsql-scheduler = { path = "crates/szrsql-scheduler" }
szrsql-replication = { path = "crates/szrsql-replication" }
szrsql-dist = { path = "crates/szrsql-dist" }
szrsql-pgcompat = { path = "crates/szrsql-pgcompat" }
szrsql-ops = { path = "crates/szrsql-ops" }
szrsql-shadow = { path = "crates/szrsql-shadow" }

# ========== 编译 Profile 强制安全门禁 ==========
[profile.dev]
lto = false
overflow-checks = true
debug = 2

[profile.test]
overflow-checks = true
debug = 2

[profile.release]
lto = true
overflow-checks = true
