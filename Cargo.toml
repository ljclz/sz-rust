sz-rust-http-facade = { workspace = true, optional = true }
sz-rust-visual = { workspace = true, optional = true }

# ── 构建优化配置 ──

[profile.dev]
opt-level = 0
debug = 1                    # 降低 debuginfo 级别（从 true 改为 1，加速编译）
incremental = true           # 显式启用增量编译
codegen-units = 16           # 并行化编译（从默认 256 降至 16 平衡）
# 启用算术溢出检查（开发期也需 fail-fast，与 release 一致，铁律 1）
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# 启用算术溢出检查（生产安全要求：溢出属于未定义行为，应 fail-fast 而非静默回绕）
overflow-checks = true

# bench profile：release 性能 + 调试符号（v1.4.0 T03.2）
[profile.bench]
inherits = "release"
debug = true

# ci profile：CI 环境最优编译速度（v1.4.0 T03.3）
[profile.ci]
inherits = "dev"
incremental = false          # CI fresh checkout 无需增量
debug = 0                    # CI 最小化 debuginfo

# 2026-09-26：曾用 [patch.crates-io] 指向本地 sz-orm 9.0.0（发布前过渡），9.0.0 已上 crates.io 后移除
