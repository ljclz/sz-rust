[workspace]
resolver = "2"
members = [
    "packages/sz-rust-core",
    "packages/sz-rust-macros",
    "packages/sz-rust-examples",
    "packages/sz-rust-addons-loader",
    "packages/sz-rust-addons-operate",
    "packages/sz-rust-pdf",
    "packages/sz-rust-cli",
    "packages/sz-rust-tracing",
    "packages/sz-rust-observability",
    "packages/sz-rust-sz300",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["SZ-Rust Team"]
license = "MIT"
description = "对标 ThinkPHP 8 的 Rust Web 框架，基于 axum 0.8 + SZ-ORM"
repository = "https://github.com/ljclz/sz-rust"
homepage = "https://github.com/ljclz/sz-rust"
keywords = ["web", "framework", "thinkphp", "axum", "orm"]
categories = ["web-programming", "web-programming::http-server"]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
# Phase 9: tokio 工具集 + CPU 核数探测
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"

# Web 框架（axum 0.8.9 + tower 0.5 + hyper 1.x）
axum = { version = "0.8", features = ["macros", "multipart", "ws", "http2"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "timeout", "fs"] }
hyper = "1"
http = "1"
http-body-util = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"

# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 工具
parking_lot = "0.12"
once_cell = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
indexmap = { version = "2", features = ["serde"] }

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }

# 校验
validator = { version = "0.20", features = ["derive"] }

# 文件上传（Phase 5.5）
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
mime_guess = "2"
infer = "0.16"
tempfile = "3"

# 随机数（Phase 5.7：对齐 PHP rand(0, 9999)）
rand = "0.8"

# 图像处理（Phase 5.8：对齐 PHP Grafika\Gd\Editor + Image + Color + Position）
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# Excel/PDF 处理（Phase 5.9：对齐 PHP phpspreadsheet + mikehaertl/php-pdftk）
rust_xlsxwriter = "0.79"
calamine = { version = "0.36", features = ["dates"] }
lopdf = "0.42"

# 加密
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# 过程宏
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# 内部依赖（SZ-ORM 全家桶，path + version 双重指定：本地开发用 path，crates.io 发布用 version）
sz-orm-core = { path = "../sz-orm/packages/sz-orm-core", version = "1.0.0" }
sz-orm-auth = { path = "../sz-orm/packages/sz-orm-auth", version = "1.0.0" }
sz-orm-storage = { path = "../sz-orm/packages/sz-orm-storage", version = "1.0.0" }
sz-orm-queue = { path = "../sz-orm/packages/sz-orm-queue", version = "1.0.0" }
sz-orm-mqtt = { path = "../sz-orm/packages/sz-orm-mqtt", version = "1.0.0" }
sz-orm-websocket = { path = "../sz-orm/packages/sz-orm-websocket", version = "1.0.0" }
sz-orm-scheduler = { path = "../sz-orm/packages/sz-orm-scheduler", version = "1.0.0" }
sz-orm-tracing = { path = "../sz-orm/packages/sz-orm-tracing", version = "1.0.0" }
sz-orm-logger = { path = "../sz-orm/packages/sz-orm-logger", version = "1.0.0" }
sz-orm-limit = { path = "../sz-orm/packages/sz-orm-limit", version = "1.0.0" }
sz-orm-config = { path = "../sz-orm/packages/sz-orm-config", version = "1.0.0" }
sz-orm-macros = { path = "../sz-orm/packages/sz-orm-macros", version = "1.0.0" }
sz-orm-sql-validator = { path = "../sz-orm/packages/sz-orm-sql-validator", version = "1.0.0" }
sz-orm-sqlx = { path = "../sz-orm/packages/sz-orm-sqlx", version = "1.0.0" }

# 内部依赖（SZ-Rust 自身）
sz-rust-core = { version = "0.2.0", path = "packages/sz-rust-core" }
sz-rust-macros = { version = "0.2.0", path = "packages/sz-rust-macros" }
sz-rust-addons-loader = { version = "0.2.0", path = "packages/sz-rust-addons-loader" }
sz-rust-pdf = { version = "0.2.0", path = "packages/sz-rust-pdf" }
sz-rust-tracing = { version = "0.2.0", path = "packages/sz-rust-tracing" }
sz-rust-observability = { version = "0.2.0", path = "packages/sz-rust-observability" }
sz-rust-cli = { version = "0.2.0", path = "packages/sz-rust-cli" }

# Phase 8: 命令行 + 调度器
clap = { version = "4.5", features = ["derive"] }
