[package]
name = "navicat-recorder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "navicat-recorder"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# 独立 crate，不加入 szrsql workspace
[workspace]
