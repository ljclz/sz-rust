# SZ-Rust Security Audit — AI 辅助安全审计
#
# 调度策略：
#   - 每周日 00:00 UTC（北京时间 08:00）自动运行全量审计
#   - 每次 push/PR 运行快速审计（仅 cargo-audit）
#   - 支持手动触发（workflow_dispatch）

name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # 每周日 00:00 UTC
  workflow_dispatch:
    inputs:
      full_audit:
        description: '执行全量审计（含 cargo-geiger）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sz-orm 为路径依赖（../sz-orm），cargo tree / cargo audit 解析依赖图前必须先 clone，
      # 否则 cargo tree -i 会因缺少路径依赖而报错空转。
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # ---- Stage 1: cargo-audit（依赖漏洞扫描）----
      # 2026-10-25 架构评测修复：移除 --deny-warnings 与 continue-on-error。
      # - 原 --deny-warnings 会让 unmaintained/unsound 信息性警告也导致失败，故使用普通 cargo audit；
      # - 原 continue-on-error=true 使漏洞公告不阻塞 CI，现改为阻塞（cargo audit 在存在漏洞时退出码非 0）。
      # 忽略清单见 .cargo/audit.toml（0 漏洞时退出码 0，仅剩信息性警告）。
      #
      # 2026-10-28 P1-7：RustSec 数据库不可拉取会导致门禁不可验证（本地实测 cargo audit 拉取失败）。
      # 现改为：缓存 advisory-db → 显式更新（失败回落缓存副本）→ 新鲜度检查 → cargo audit --stale。
      # 新鲜度超过 14 天直接失败，避免"用三个月前的漏洞库证明安全"。
      - name: Cache RustSec advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.run_id }}
          restore-keys: |
            advisory-db-

      - name: Refresh advisory database (fallback to cache)
        run: |
          DB="$HOME/.cargo/advisory-db"
          if git -C "$DB" rev-parse --git-dir > /dev/null 2>&1; then
            if git -C "$DB" fetch --depth=1 origin master 2>/dev/null; then
              git -C "$DB" reset --hard FETCH_HEAD --quiet
            else
              echo "::warning::RustSec advisory-db 更新失败，使用缓存副本"
            fi
          else
            rm -rf "$DB"
            git clone --depth=1 https://github.com/rustsec/advisory-db.git "$DB"
          fi
          COMMIT_TS=$(git -C "$DB" log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - COMMIT_TS ) / 86400 ))
          echo "advisory-db age: ${AGE_DAYS} day(s), commit: $(git -C "$DB" rev-parse --short HEAD)"
          if [ "$AGE_DAYS" -gt 14 ]; then
            echo "::error::advisory-db 已过期 ${AGE_DAYS} 天（>14）— 漏洞门禁结果不可信"
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        # --stale：使用上一步已更新并校验新鲜度的本地库，避免二次联网拉取失败
        run: cargo audit --stale
        id: audit

      # P0-2 unmaintained 真实编译检查
      # 校验登记在 .cargo/audit.toml 的 unmaintained crate 真实存在于依赖树（需先 clone sz-orm 路径依赖）：
      # - paste 1.0.15 经 wasmi_core / pulp / oracle 仍在树中（非 ab_glyph）
      # - rustls-pemfile 2.2.0 经 tokio-rustls 在树中
      # 任一 crate 缺失即视为 ignore 条目过期，fail 提示移除对应条目。
      - name: Verify unmaintained dependencies are real (present in tree)
        run: |
          set -uo pipefail
          for CRATE in paste rustls-pemfile; do
            echo "=== cargo tree -i $CRATE ==="
            if cargo tree -i "$CRATE" > /dev/null 2>&1; then
              echo "✅ $CRATE is genuinely present in the dependency tree (ignore entry is justified)"
            else
              echo "::error::$CRATE not found in dependency tree — the corresponding ignore entry in .cargo/audit.toml is stale and should be removed"
              exit 1
            fi
          done

      - name: Audit summary
        if: always()
        run: |
          echo "## 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **cargo-audit**: ${{ steps.audit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **unmaintained check**: paste/rustls-pemfile verified as real deps" >> $GITHUB_STEP_SUMMARY

  geiger:
    name: Unsafe Code Check (cargo-geiger)
    runs-on: ubuntu-latest
    if: github.event.inputs.full_audit == 'true' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-sz-orm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-geiger
        run: cargo install cargo-geiger

      - name: Run cargo-geiger
        # 非阻塞汇总：cargo-geiger 默认不因检测到 unsafe 代码而失败（未配置 --fail-under 阈值）。
        # workspace 已 forbid(unsafe_code)，geiger 仅对传递依赖的 unsafe 代码做统计，
        # 结果写入 step summary 供人工评估，不阻塞 CI。
        run: cargo geiger --include-tests --all-features
        id: geiger

      - name: Geiger summary
        if: always()
        run: |
          echo "- **cargo-geiger**: ${{ steps.geiger.outcome }}" >> $GITHUB_STEP_SUMMARY

  report:
    name: AI Audit Report
    runs-on: ubuntu-latest
    needs: [audit, geiger]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate security report
        run: |
          echo "## 🛡️ AI 辅助安全审计报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-audit（依赖漏洞） | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-geiger（unsafe code） | ${{ needs.geiger.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| forbid(unsafe_code) lint | ✅ 已配置 |" >> $GITHUB_STEP_SUMMARY
          echo "| 参数化 SQL 绑定 | ✅ 已实现 |" >> $GITHUB_STEP_SUMMARY
          echo "| CSRF 防护 | ✅ 已实现 |" >> $GITHUB_STEP_SUMMARY
          echo "| 敏感字段脱敏 | ✅ 已实现 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 详细审计报告见 [docs/security-audit-guide.md](docs/security-audit-guide.md)" >> $GITHUB_STEP_SUMMARY
