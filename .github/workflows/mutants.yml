# SZ-Rust Mutation Testing — 变异测试
#
# 使用 cargo-mutants 对 sz-rust-core 进行变异测试，评估测试套件质量。
# cargo-mutants 会自动修改源码（如将 > 改为 >=、删除条件判断等），
# 若变异体仍能通过测试，说明测试覆盖不足。
#
# 调度策略：
#   - 每周日 02:00 UTC（北京时间 10:00）自动运行
#   - 支持手动触发（workflow_dispatch）
#   - 仅对 packages/sz-rust-core 运行（避免全 workspace 耗时过长）
#
# 参考：sz-orm ci.yml 与 soak.yml 的调度风格

name: Mutants

on:
  schedule:
    - cron: '0 2 * * 0'  # 每周日 02:00 UTC
  workflow_dispatch:

# 防止并发运行（变异测试耗时较长，避免重复占用 runner）
concurrency:
  group: mutants
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutants:
    name: Mutation Testing (sz-rust-core)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      # 仅对 sz-rust-core 运行变异测试（-p 指定包，--in-place 避免拷贝整个 workspace）
      - name: Run cargo mutants
        run: cargo mutants -p sz-rust-core --in-place --no-shuffle

      # 失败时上传突变测试报告（mutants.out/ 目录 + mutants.json 汇总）
      - name: Upload mutants report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-${{ github.sha }}
          path: |
            mutants.out/
            mutants.json
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Mutation testing detected surviving mutants — 请检查 mutants-report 中的存活变异体"
