# SZ-Rust Code Coverage — 代码覆盖率
#
# 使用 cargo-tarpaulin 统计覆盖率并上传到 Codecov
# 参考：sz-orm ci.yml 中的 coverage job

name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    continue-on-error: true  # 覆盖率失败不阻塞 PR
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage
        run: cargo tarpaulin --workspace --out Xml --output-dir coverage/ -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
