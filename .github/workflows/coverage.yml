# SZ-Rust Code Coverage — 代码覆盖率
#
# CI-004~007：分片并行覆盖率矩阵 + 合并校验 + COVERAGE_THRESHOLD 环境变量
# 使用 cargo-llvm-cov 统计覆盖率，分 4 个优先级分片并行执行后合并

name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 85
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # ── CI-004：4 个并行分片 job ──

  coverage-p0:
    name: Coverage P0 (core/router/middleware/orm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage P0
        run: |
          cargo llvm-cov \
            -p sz-rust-core \
            -p sz-rust-router-facade \
            -p sz-rust-middleware-facade \
            -p sz-rust-orm-facade \
            --cobertura --output-path cobertura-p0.xml
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-p0
          path: cobertura-p0.xml
          retention-days: 14

  coverage-p1:
    name: Coverage P1 (sz300/ai/auth/observability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage P1
        run: |
          cargo llvm-cov \
            -p sz-rust-sz300 \
            -p sz-rust-ai-facade --features all-providers \
            -p sz-rust-auth-facade \
            -p sz-rust-observability \
            --cobertura --output-path cobertura-p1.xml
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-p1
          path: cobertura-p1.xml
          retention-days: 14

  coverage-p2:
    name: Coverage P2 (http/cache/state/infra/mvc/orm-ext/pay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage P2
        run: |
          cargo llvm-cov \
            -p sz-rust-http-facade \
            -p sz-rust-cache-facade \
            -p sz-rust-state-facade \
            -p sz-rust-infra-facade \
            -p sz-rust-mvc-facade \
            -p sz-rust-orm-ext-facade \
            -p sz-rust-pay-facade \
            --cobertura --output-path cobertura-p2.xml
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-p2
          path: cobertura-p2.xml
          retention-days: 14

  coverage-p3:
    name: Coverage P3 (addons/cli/mcp/rag/codegen/capability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage P3
        run: |
          cargo llvm-cov \
            -p sz-rust-addons-crm \
            -p sz-rust-addons-ecommerce \
            -p sz-rust-addons-cms \
            -p sz-rust-addons-loader \
            -p sz-rust-cli \
            -p sz-rust-mcp \
            -p sz-rust-rag \
            -p sz-rust-frontend-codegen \
            -p sz-rust-capability \
            -p sz-rust-examples \
            -p sz-rust-facade-tests \
            --cobertura --output-path cobertura-p3.xml
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-p3
          path: cobertura-p3.xml
          retention-days: 14

  # ── CI-006：sz300 DB 集成覆盖率（含 --ignored + --fail-under 85）──

  coverage-sz300:
    name: Coverage sz300 (incl. DB integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest123"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run sz300 coverage with DB integration tests
        run: |
          cargo llvm-cov -p sz-rust-sz300 \
            --cobertura --output-path cobertura-sz300.xml \
            --fail-under-lines ${COVERAGE_THRESHOLD} \
            -- --include-ignored --test-threads=1
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-sz300
          path: cobertura-sz300.xml
          retention-days: 14

  # ── CI-005：合并分片 + per-crate 校验 + Codecov 上报 ──

  coverage-merge:
    name: Coverage Merge & Verify
    runs-on: ubuntu-latest
    needs: [coverage-p0, coverage-p1, coverage-p2, coverage-p3, coverage-sz300]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p coverage-merged
          find coverage-artifacts -name "cobertura-*.xml" -exec cp {} coverage-merged/ \;
          ls -la coverage-merged/

      - name: Merge Cobertura XMLs
        run: |
          node scripts/audit/cobertura-merger.js \
            --inputs "coverage-merged/cobertura-*.xml" \
            --output cobertura-workspace.xml

      - name: Per-crate coverage gate
        run: |
          node scripts/audit/per-crate-coverage.js \
            --xml cobertura-workspace.xml \
            --threshold ${COVERAGE_THRESHOLD} \
            --exempt docs/audit/coverage-exemption.md

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-workspace-${{ github.sha }}
          path: cobertura-workspace.xml
          retention-days: 14

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura-workspace.xml
          fail_ci_if_error: true
