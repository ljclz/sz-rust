# SZ-Rust Code Coverage — 代码覆盖率
#
# 使用 cargo-tarpaulin 统计覆盖率并上传到 Codecov
# 仅对 packages/sz-rust-core 运行（避免全 workspace 耗时过长）
# 参考：sz-orm ci.yml 中的 coverage job

name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 将 CODECOV_TOKEN 是否配置暴露为环境变量，供 step 条件判断使用
  # （GitHub Actions 不允许在 if 中直接比较 secrets，需经 env 中转）
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # 仅对 sz-rust-core 运行覆盖率统计
      # P1-CICD-01：--fail-under 85 强制覆盖率阈值，与 ci.yml 门禁 14 一致（铁律 10），低于 85% 时 CI 失败
      - name: Run coverage
        run: cargo tarpaulin -p sz-rust-core --lib --out Xml --output-dir coverage/ --fail-under 85 -- --test-threads=1

      # 仅在配置了 CODECOV_TOKEN 时上传到 Codecov
      # P1-CICD-01：fail_ci_if_error: true — 上传失败时阻断 CI
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: true

      # 始终上传覆盖率报告 artifact（无论测试成功与否）
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # sz300 覆盖率：含 DB 集成测试（--ignored）的完整统计
  # 背景：2026-08-15 实测 lib 视角仅 8.7%（226/2583 行）——controllers/services 的
  # 覆盖集中在集成测试与 DB 集成测试（db_integration_test 26 个 ignored，需真实 DB）。
  # 本 job 在 MySQL 9.6 + PostgreSQL 18 服务容器上统计完整覆盖率，作为达标基线。
  # 阈值说明：暂不强制 --fail-under（当前未达标），随测试补齐后启用（铁律 10 目标 ≥85%）。
  coverage-sz300:
    name: Coverage sz300 (incl. DB integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest123"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage with DB integration tests
        run: cargo tarpaulin -p sz-rust-sz300 --ignored --out Xml --output-dir coverage-sz300/ -- --test-threads=1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sz300-${{ github.sha }}
          path: coverage-sz300/
          if-no-files-found: warn
          retention-days: 14
