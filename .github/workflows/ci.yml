name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 85
  # CI 编译缓存由 Swatinem/rust-cache 承担；sccache 仅为本地开发优化。
  # .cargo/config.toml 的 rustc-wrapper=sccache 在未安装 sccache 的环境会导致
  # "could not execute process" 编译失败，CI 统一禁用（与 .githooks/pre-commit 的降级逻辑一致）
  RUSTC_WRAPPER: ""
  # 2026-10-28 P2-6：DB 集成测试凭据只存在于 CI service 配置，源码通过环境变量读取
  SZ_TEST_DB_PASSWORD: test123
  SZ_TEST_PG_PASSWORD: test123
  SZ_TEST_MYSQL_URL: mysql://root:test123@127.0.0.1:3306/sz_orm_test
  SZ_TEST_PG_URL: postgres://postgres:test123@127.0.0.1:5432/sz_orm_test

jobs:
  # 门禁 1：代码格式检查
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-sz-orm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 不能直接用 cargo fmt --all：--all 会连带格式化本地 path 依赖 ../sz-orm，
      # 而上游仓库在钉住提交上并非 rustfmt-clean，会把本仓库门禁拖红。
      # cargo fmt 也没有 --workspace，故按 workspace 成员逐个 --check。
      - name: Check formatting (workspace members only)
        run: |
          set -uo pipefail
          members=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name')
          status=0
          for p in $members; do
            cargo fmt -p "$p" --check || status=1
          done
          exit $status

  # 门禁 2：工作空间编译验证
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-tauri-linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # 门禁 2.1：依赖可复现性（sz-orm 提交固定 + 声明版本与实际解析一致）
  repro-check:
    name: Dependency reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm at pinned commit
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify path dependencies
        run: python3 scripts/audit/dependency-reproducibility.py
      - name: Verify lockfile is complete
        run: cargo metadata --locked --format-version 1 > /dev/null

  # 门禁 3：严格静态分析
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/install-tauri-linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # 门禁 4：工作空间测试
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-tauri-linux-deps
      - uses: Swatinem/rust-cache@v2
      # P3-3 修复：--jobs 1 规避 Cargo 在高并发编译时的 crate 解析竞争问题
      # 此问题为 Cargo 工具链已知限制（非代码问题），单线程编译可稳定通过
      - run: cargo test --workspace --all-targets --jobs 1
      # sz-rust-testkit 的测试在 test-utils feature gate 后面，需显式启用
      - run: cargo test -p sz-rust-testkit --features test-utils --jobs 1

  # 门禁 5：文档构建（含 missing_docs 检查）
  doc:
    name: Documentation (missing_docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-tauri-linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings -A missing_docs -A rustdoc::broken_intra_doc_links"

  # 门禁 6：安全审计
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        # 忽略清单统一由 .cargo/audit.toml 管理（含 RUSTSEC-2026-0258 / RUSTSEC-2024-0370），
        # 不再在 CLI 硬编码 --ignore，避免命令行与 audit.toml 漂移。
        run: cargo audit

  # 门禁 6b：cargo-deny 依赖审计（许可证 + 安全 + 来源）
  deny:
    name: Cargo Deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories (RUSTSEC)
        run: cargo deny check advisories
      - name: Check licenses
        run: cargo deny check licenses
      - name: Check bans (duplicate deps)
        run: cargo deny check bans
      - name: Check sources
        run: cargo deny check sources

  # 门禁 7：禁止占位实现检查
  no-placeholder:
    name: No Placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查禁止的占位实现
        # 只看代码行：文档注释里出现 `unimplemented!()` 示例（如 plugin-sdk 的
        # 错误处理示例）不是占位实现，按注释行过滤，避免误判。
        run: |
          hits=$(grep -rnE '\b(todo!\(\)|unimplemented!\(\)|panic!\("not implemented)' \
            --include="*.rs" packages/ | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "❌ 发现禁止的占位实现"
            exit 1
          fi
          echo "✅ 未发现占位实现"

  # 门禁 8：feature 全组合编译验证
  feature-matrix:
    name: Feature Matrix (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-tauri-linux-deps
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run feature matrix check
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # 门禁 9：未使用依赖检测
  unused-deps:
    name: Unused Dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
      - uses: ./.github/actions/install-tauri-linux-deps
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run unused deps check
        run: cargo +nightly udeps --workspace --all-targets

  # 门禁 10：过期依赖检测
  outdated:
    name: Outdated Dependencies (cargo-outdated)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked
      - name: Check outdated dependencies
        # cargo-outdated 把工作区复制到 /tmp/cargo-outdatedXXXX 后再解析，此时
        # Cargo.toml 的 path = "../sz-orm/..." 解析为 /tmp/sz-orm；先补软链，
        # 否则报 "failed to read /tmp/sz-orm/packages/sz-orm-auth/Cargo.toml"。
        run: |
          ln -sfn "$(cd .. && pwd)/sz-orm" /tmp/sz-orm
          cargo outdated --workspace --depth 2

  # 门禁 11：cargo-machete 未使用依赖检测
  machete:
    name: Unused Dependencies (cargo-machete)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Run cargo-machete
        run: cargo machete

  # 门禁 13：ADR 覆盖率检查（规则 14 支撑）
  adr-coverage:
    name: ADR Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 ADR 覆盖率检查脚本
        run: bash scripts/check-adr-coverage.sh

      - name: 检查 ADR 索引同步
        run: |
          echo "检查 ADR 索引是否包含所有 ADR 文件..."
          adr_files=$(find docs/adr -name "*.md" ! -name "README.md" | wc -l)
          index_refs=$(grep -c "ADR-" docs/adr/README.md || true)
          echo "ADR 文件数: $adr_files  索引引用数: $index_refs"
          if [ "$index_refs" -lt "$adr_files" ]; then
            echo "::warning::ADR 索引可能未同步，请检查 docs/adr/README.md"
          fi

      - name: 验证 ADR 必填字段
        run: |
          echo "验证每个 ADR 的必填字段..."
          errors=0
          for file in docs/adr/ADR-*.md docs/adr/[0-9]*.md; do
            [ -f "$file" ] || continue
            for field in "状态" "日期" "决策"; do
              if ! grep -q "$field" "$file"; then
                echo "::error file=$file::缺少必填字段: $field"
                errors=$((errors + 1))
              fi
            done
            for field in "相关代码" "背景" "后果" "注意事项" "Bug 定位提示"; do
              if ! grep -q "$field" "$file"; then
                echo "::warning file=$file::缺少建议字段: $field"
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::共 $errors 个 ADR 格式问题"
            exit 1
          fi
          echo "所有 ADR 格式验证通过"

      - name: 验证 ADR 代码行号引用
        run: |
          echo "检查 ADR 中的代码行号引用是否有效..."
          for file in docs/adr/ADR-*.md docs/adr/[0-9]*.md; do
            [ -f "$file" ] || continue
            code_refs=$(grep "相关代码" "$file" | grep -oE 'packages/[^ `]+' || true)
            for ref in $code_refs; do
              filepath=$(echo "$ref" | sed 's/ *([^)]*)//')
              if [ -n "$filepath" ] && [ ! -f "$filepath" ]; then
                echo "::warning file=$file::引用文件不存在: $filepath"
              fi
            done
          done
          echo "代码行号检查完成"

  # 门禁 12：DB 集成测试（P1-TEST-02）—— 已迁移至 db-integration.yml
  # sz-rust-sz300 业务包仍为本 workspace member（Cargo.toml members）；
  # DB-backed ignored 集成测试（MySQL/PG/Redis）由
  # .github/workflows/db-integration.yml（SDET P0-1 新增）显式执行 --ignored。

  # 门禁 14：行覆盖率 ≥ 85%（规则 10；SDET P1-2 移除 continue-on-error，改为阻塞）
  coverage:
    name: Coverage (>= 85%)
    runs-on: ubuntu-latest
    needs: [assertion-value]
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-tauri-linux-deps
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse coverage stage from commit message
        id: cov-stage
        run: |
          THRESHOLD=${COVERAGE_THRESHOLD:-85}
          MSG="${{ github.event.head_commit.message }}"
          case "$MSG" in
            *"[coverage-stage:S1]"*) THRESHOLD=30 ;;
            *"[coverage-stage:S2]"*) THRESHOLD=50 ;;
            *"[coverage-stage:S3]"*) THRESHOLD=70 ;;
            *"[coverage-stage:S4]"*) THRESHOLD=85 ;;
          esac
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "Coverage threshold: $THRESHOLD"
      - name: Run workspace coverage (regular tests)
        run: |
          cargo llvm-cov --workspace \
            --exclude sz-orm-macros --exclude sz-rust-macros \
            --cobertura --output-path cobertura.xml \
            --fail-under-lines ${{ steps.cov-stage.outputs.threshold }}
      # 注：sz300 DB-backed ignored 集成测试由 db-integration.yml 执行；
      # 此处 llvm-cov --workspace 合并全 workspace 行覆盖率报告。
      - name: Merge coverage reports
        run: |
          node scripts/audit/cobertura-merger.js \
            --inputs "cobertura*.xml" \
            --output cobertura-workspace.xml
      - name: Per-crate coverage gate
        run: |
          node scripts/audit/per-crate-coverage.js \
            --xml cobertura-workspace.xml \
            --threshold ${{ steps.cov-stage.outputs.threshold }} \
            --exempt docs/audit/coverage-exemption.md
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura-workspace.xml

  # 门禁 15：编译时间监控（拆包收益量化 + 防回归）
  # 首次运行（基线不存在）→ 保存基线；之后 → 与基线对比，超阈值仅 warning 不阻塞
  compile-time:
    name: Compile Time Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure and compare compile time
        run: bash scripts/check-compile-time.sh --threshold-percent=50 || true
      - name: Upload timings artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/

  # 门禁 16：Miri 内存/UB 检测（规则支撑：内存泄漏盲区）
  # 对纯逻辑 facade-tests 跑 miri；SDET P1-7 移除 continue-on-error，UB/内存问题即 fail-closed
  miri:
    name: Miri (UB + memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on facade integration tests
        run: cargo +nightly miri test -p sz-rust-facade-tests --jobs 1
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  # 门禁 17：Windows 兼容性验证
  # 规避 rustc STATUS_STACK_BUFFER_OVERRUN bug：强制 CARGO_INCREMENTAL=0
  # 见 .trae/rules/project_rules.md 铁律 2（异步运行时）
  windows:
    name: Windows Compatibility
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        shell: bash
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace compiles (CARGO_INCREMENTAL=0)
        run: cargo check --workspace --all-targets
      - name: Run lib tests (no integration)
        run: cargo test --workspace --lib --jobs 1

      # SDET 门禁 30 配套：Windows 内存基线测试（RSS 回归对比），
      # 依赖 Windows + sysinfo，随 windows job 执行（默认 ignored）
      - name: Run windows memory baseline (ignored)
        run: cargo test -p sz-rust-sz300 --test windows_memory_baseline -- --ignored --nocapture

  # 门禁 18：AI Facade 专项检查（--features all-providers）
  ai-facade:
    name: AI Facade (all-providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test with all-providers feature
        run: cargo test -p sz-rust-ai-facade --features all-providers
      - name: Clippy with all-providers feature
        run: cargo clippy -p sz-rust-ai-facade --features all-providers -- -D warnings
      - name: Doc with all-providers feature
        run: cargo doc -p sz-rust-ai-facade --features all-providers --no-deps

  # 门禁 19：文档-代码一致性（规则 23 + 24 支撑，防幻影交付 + 链接/版本/feature/文件名一致性）
  # 扫描 README/CHANGELOG/docs 声称的 sz-rust-* crate，必须存在于 workspace（铁律 23）
  # 扩展（2026-10-27，铁律 24）：Markdown 相对链接可解析、README 版本号与 Cargo.toml 一致、
  #   --features 引用存在于 workspace [features]；任一失败 ERROR 构建失败
  doc-code-consistency:
    name: Doc-Code Consistency (crates + links + version + features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/adr/README*.md 与 .trae/skills 下有指向 ../sz-orm 的相对链接，
      # 缺兄弟仓库时 link-check 会判 broken
      - uses: ./.github/actions/checkout-sz-orm
      - name: Check claimed crates + links + version + features (gate 19)
        run: node scripts/audit/doc-code-consistency.js
      - name: Standalone link/version/feature check (gate 19, rerunnable)
        run: node scripts/audit/link-check.js

  # 门禁 20：ADR-代码对账（规则 14 支撑，ADR 引用代码必须存在）
  # 替换原 adr-coverage job 内嵌的"代码行号引用检查"步骤，独立为脚本
  adr-code:
    name: ADR Code Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR code references exist
        run: node scripts/audit/adr-code-consistency.js

  # 门禁 21：测试断言价值（规则 10/23 支撑，拒绝无断言的行覆盖）
  # 无断言且无 unwrap/expect 的测试 = 覆盖率空洞，无论实现多正确都会"通过"
  assertion-value:
    name: Assertion Value (no empty tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tests have assertions
        run: node scripts/audit/assertion-value-check.js

  # 门禁 22：配置-代码一致性（feature 声明 vs 源码引用）
  # 源码引用的 feature 未声明 = 永远不可启用（死代码）；声明的死 feature 提示清理
  feature-consistency:
    name: Feature Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check feature declarations match source
        run: node scripts/audit/feature-consistency.js

  # 门禁 23：仓库隔离检查 — 已随 ADR-043（2026-10-25 单一版本合并）废止：
  # 企业版已并入本仓库，OSS/Enterprise 物理隔离不复存在，该检查与新架构矛盾。
  # 保留 scripts/check_isolation.py 供历史追溯，不再在 CI 执行。

  # 门禁 24：许可证合规检查（P0-3）
  license-compliance:
    name: License Compliance (Apache-2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_license_compliance.py --project-root . --mode all --expected-license Apache-2.0

  # 门禁 25：crate 级 dead_code 检查（P0-3）
  no-crate-dead-code:
    name: No Crate-level allow(dead_code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_no_crate_level_allow_dead_code.py --project-root .
  # 门禁 26：i18n 完整性检查（v1.4.0 T12）
  i18n-completeness:
    name: i18n Completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check i18n translation completeness
        run: bash scripts/check-i18n-completeness.sh

  # 门禁 27：框架-业务边界检查（v1.4.0 T07）
  boundary-check:
    name: Framework-Business Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-boundary.sh 内部执行 cargo metadata，缺 ../sz-orm 时直接非零退出
      - uses: ./.github/actions/checkout-sz-orm
      - name: Check no reverse dependencies
        run: bash scripts/check-boundary.sh

  # 门禁 28：OpenAPI-路由一致性（2026-10-27 全栈评测 P1-1 落地）
  # 校验 sz300 `router.rs` 定义的路由与 `openapi.rs` 注册的 OpenAPI 端点一致，
  # 防止 API 文档与实现漂移（脚本: scripts/audit/openapi-consistency.js）
  openapi-consistency:
    name: OpenAPI Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenAPI routes match router
        run: node scripts/audit/openapi-consistency.js

  # 门禁 29：生产 unwrap 门禁（2026-10-27 全栈评测 P1-5 落地）
  # check-unwrap.py 剔除 #[cfg(test)] 模块 / #[test] 函数 / 字符串字面量与注释后，
  # 统计生产代码中的 `.unwrap()` 数量；当前实测 0（2026-10-27），阈值设为 0，
  # 防止生产路径新增 unwrap。core/sz300 另在 lib.rs 以
  # `#![cfg_attr(not(test), deny(clippy::unwrap_used))]` 做编译期灰度门禁。
  unwrap-gate:
    name: Unwrap Gate (production unwrap = 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run production unwrap gate
        run: python scripts/check-unwrap.py --max 0

  # ── SDET 评测防复发门禁 30-34（2026-10-28）──

  # 门禁 30：ignored 测试路由（P0-1 防复发）
  # 每个 #[ignore] 测试必须被某 workflow 的 --ignored 命令显式覆盖，
  # 或登记 docs/audit/ignored-test-exemption.md 豁免（仅限外部凭据）。
  ignored-test-routing:
    name: Ignored Test Routing (P0-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ignored tests are routed to workflows
        run: node scripts/audit/ignored-test-routing.js

  # 门禁 31：覆盖率矩阵完整性（P1-1 防复发）
  # 每个 workspace member 必须出现在 coverage.yml 分片或豁免清单（含到期日）。
  coverage-matrix-completeness:
    name: Coverage Matrix Completeness (P1-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check coverage matrix covers all members
        run: node scripts/audit/coverage-matrix-completeness.js

  # 门禁 32：CI 配置审计（P1-2/P1-5/P1-6/P1-7 防复发）
  # 阈值一致 / continue-on-error 清零 / kill-rate fail-closed /
  # 性能回归门禁接线 / 无 .disabled workflow。
  ci-config-audit:
    name: CI Config Audit (P1-2/5/6/7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit CI configuration invariants
        run: node scripts/audit/ci-config-audit.js

  # 门禁 33：测试卫生（P1-3/P1-4/P2-4 防复发）
  # async 内 thread::sleep / 长 sleep / 固定端口 / 硬编码凭据 / panic! 断言。
  test-hygiene-check:
    name: Test Hygiene Check (P1-3/4, P2-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan test hygiene anti-patterns
        run: node scripts/audit/test-hygiene-check.js

  # 门禁 34：孤儿源文件（防未编译模块）
  # src/ 下未被 lib.rs/main.rs/bin 挂载的 .rs 文件不得新增。
  orphan-module-check:
    name: Orphan Module Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect orphan source files
        run: node scripts/audit/orphan-module-check.js

  # 门禁 35：性能静态检测器（2026-10-28 评测 P1-12）
  # 4 个检测器（N+1 / 锁跨 await / async 阻塞调用 / 串行 await）此前未接入 CI，
  # 铁律 3（性能基线）无执行点。本 job 为 warn 级：发现候选问题只标注告警，
  # 不阻塞合入（检测器存在已知误报，需人工判断），但检测器崩溃/缺失会失败。
  perf-static:
    name: Perf Static Detectors (warn-level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run performance static detectors
        run: |
          set -u
          scan() {
            label="$1"; script="$2"
            if [ ! -f "$script" ]; then
              echo "::error::missing detector $script"
              exit 1
            fi
            # GitHub 用 bash -e 执行；直接 out=$(cmd) 会让 cmd 非零（= 有命中）在赋值处
            # 终止整个 job。用 `|| code=$?` 接住，命中(1)按 warn 处理，真崩溃(>1)仍失败。
            code=0
            out=$(python "$script" packages 2>&1) || code=$?
            if [ "$code" -gt 1 ]; then
              echo "::error::detector crashed (exit=$code) $script"
              printf '%s\n' "$out"
              exit 1
            fi
            echo "::group::$label (exit=$code)"
            echo "$out"
            echo "::endgroup::"
            hits=$(printf '%s\n' "$out" | grep -cE '\[(N_PLUS_ONE|LOCK_ACROSS_AWAIT|BLOCKING_CALL|SERIAL_AWAIT)\]' || true)
            echo "::warning title=$label::$hits candidate finding(s) — review log"
            return 0
          }
          scan "N+1" scripts/perf/detect_n_plus_one.py
          scan "LockAcrossAwait" scripts/perf/detect_lock_across_await.py
          scan "BlockingCall" scripts/perf/detect_blocking_call.py
          scan "SerialAwait" scripts/perf/detect_serial_await.py
          exit 0

  # 门禁 36：advisory ignore 复核期限（2026-10-28 评测 P1-6）
  # deny.toml 中每条临时忽略的 RUSTSEC 公告必须带 review-by 到期日，过期即失败。
  advisory-ignore-expiry:
    name: Advisory Ignore Expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deny.toml ignore review-by dates
        run: python scripts/audit/advisory-ignore-expiry.py

  # 门禁 37：未接线 crate 清单（2026-10-28 评测 P1-8）
  # workspace 内零入度成员（无 normal/build 依赖）必须登记角色与复核期限。
  unwired-crates:
    name: Unwired Crate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check unwired crate manifest
        run: node scripts/audit/unwired-crates.js
