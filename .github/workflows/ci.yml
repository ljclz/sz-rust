name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 85

jobs:
  # 门禁 1：代码格式检查
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # 门禁 2：工作空间编译验证
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # 门禁 3：严格静态分析
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # 门禁 4：工作空间测试
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # P3-3 修复：--jobs 1 规避 Cargo 在高并发编译时的 crate 解析竞争问题
      # 此问题为 Cargo 工具链已知限制（非代码问题），单线程编译可稳定通过
      - run: cargo test --workspace --all-targets --jobs 1

  # 门禁 5：文档构建（含 missing_docs 检查）
  doc:
    name: Documentation (missing_docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings -A missing_docs -A rustdoc::broken_intra_doc_links"

  # 门禁 6：安全审计
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0068 --ignore RUSTSEC-2025-0067 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2024-0370

  # 门禁 6b：cargo-deny 依赖审计（许可证 + 安全 + 来源）
  deny:
    name: Cargo Deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories (RUSTSEC)
        run: cargo deny check advisories
      - name: Check licenses
        run: cargo deny check licenses
      - name: Check bans (duplicate deps)
        run: cargo deny check bans
      - name: Check sources
        run: cargo deny check sources

  # 门禁 7：禁止占位实现检查
  no-placeholder:
    name: No Placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查禁止的占位实现
        run: |
          if grep -rn 'todo!()\|unimplemented!()\|panic!("not implemented' --include="*.rs" packages/; then
            echo "❌ 发现禁止的占位实现"
            exit 1
          else
            echo "✅ 未发现占位实现"
          fi

  # 门禁 8：feature 全组合编译验证
  feature-matrix:
    name: Feature Matrix (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run feature matrix check
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # 门禁 9：未使用依赖检测
  unused-deps:
    name: Unused Dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run unused deps check
        run: cargo +nightly udeps --workspace --all-targets

  # 门禁 10：过期依赖检测
  outdated:
    name: Outdated Dependencies (cargo-outdated)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked
      - name: Check outdated dependencies
        run: cargo outdated --workspace --depth 2

  # 门禁 11：cargo-machete 未使用依赖检测
  machete:
    name: Unused Dependencies (cargo-machete)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Run cargo-machete
        run: cargo machete

  # 门禁 13：ADR 覆盖率检查（规则 14 支撑）
  adr-coverage:
    name: ADR Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 ADR 覆盖率检查脚本
        run: bash scripts/check-adr-coverage.sh

      - name: 检查 ADR 索引同步
        run: |
          echo "检查 ADR 索引是否包含所有 ADR 文件..."
          adr_files=$(find docs/adr -name "*.md" ! -name "README.md" | wc -l)
          index_refs=$(grep -c "ADR-" docs/adr/README.md || true)
          echo "ADR 文件数: $adr_files  索引引用数: $index_refs"
          if [ "$index_refs" -lt "$adr_files" ]; then
            echo "::warning::ADR 索引可能未同步，请检查 docs/adr/README.md"
          fi

      - name: 验证 ADR 必填字段
        run: |
          echo "验证每个 ADR 的必填字段..."
          errors=0
          for file in docs/adr/ADR-*.md docs/adr/[0-9]*.md; do
            [ -f "$file" ] || continue
            for field in "状态" "日期" "决策"; do
              if ! grep -q "$field" "$file"; then
                echo "::error file=$file::缺少必填字段: $field"
                errors=$((errors + 1))
              fi
            done
            for field in "相关代码" "背景" "后果" "注意事项" "Bug 定位提示"; do
              if ! grep -q "$field" "$file"; then
                echo "::warning file=$file::缺少建议字段: $field"
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::共 $errors 个 ADR 格式问题"
            exit 1
          fi
          echo "所有 ADR 格式验证通过"

      - name: 验证 ADR 代码行号引用
        run: |
          echo "检查 ADR 中的代码行号引用是否有效..."
          for file in docs/adr/ADR-*.md docs/adr/[0-9]*.md; do
            [ -f "$file" ] || continue
            code_refs=$(grep "相关代码" "$file" | grep -oE 'packages/[^ `]+' || true)
            for ref in $code_refs; do
              filepath=$(echo "$ref" | sed 's/ *([^)]*)//')
              if [ -n "$filepath" ] && [ ! -f "$filepath" ]; then
                echo "::warning file=$file::引用文件不存在: $filepath"
              fi
            done
          done
          echo "代码行号检查完成"

  # 门禁 12：DB 集成测试（P1-TEST-02）
  # 启动真实 MySQL 9.6 + PostgreSQL 18，运行 #[ignore] 的 DB 集成测试
  # 覆盖：连接池 / 事务原子性 / SAVEPOINT / SQL 注入防护 / 业务 schema CRUD
  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run DB integration tests (ignored)
        run: cargo test --package sz-rust-sz300 --test db_integration_test -- --ignored --test-threads=1

  # 门禁 14：行覆盖率 ≥ 85%（规则 10）
  # 使用 cargo-llvm-cov（跨平台：Linux CI + Windows 本地均可运行）
  # 排除 sz-orm-macros / sz-rust-macros（proc-macro crate，instrument-coverage 下存在重复定义冲突）
  # CI-001~007：拆分常规+DB覆盖率、per-crate 校验、与门禁 21 联动、COVERAGE_THRESHOLD 环境变量
  coverage:
    name: Coverage (>= 85%)
    runs-on: ubuntu-latest
    needs: [assertion-value]
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse coverage stage from commit message
        id: cov-stage
        run: |
          THRESHOLD=${COVERAGE_THRESHOLD:-85}
          MSG="${{ github.event.head_commit.message }}"
          case "$MSG" in
            *"[coverage-stage:S1]"*) THRESHOLD=30 ;;
            *"[coverage-stage:S2]"*) THRESHOLD=50 ;;
            *"[coverage-stage:S3]"*) THRESHOLD=70 ;;
            *"[coverage-stage:S4]"*) THRESHOLD=85 ;;
          esac
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "Coverage threshold: $THRESHOLD"
      - name: Run workspace coverage (regular tests)
        run: |
          cargo llvm-cov --workspace \
            --exclude sz-orm-macros --exclude sz-rust-macros \
            --cobertura --output-path cobertura.xml \
            --fail-under-lines ${{ steps.cov-stage.outputs.threshold }}
      - name: Run sz300 DB integration coverage
        run: |
          cargo llvm-cov -p sz-rust-sz300 \

            --cobertura --output-path cobertura-sz300-db.xml \
            -- --ignored --test-threads=1
      - name: Merge coverage reports
        run: |
          node scripts/audit/cobertura-merger.js \
            --inputs "cobertura.xml cobertura-sz300-db.xml" \
            --output cobertura-workspace.xml
      - name: Per-crate coverage gate
        run: |
          node scripts/audit/per-crate-coverage.js \
            --xml cobertura-workspace.xml \
            --threshold ${{ steps.cov-stage.outputs.threshold }} \
            --exempt docs/audit/coverage-exemption.md
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura-workspace.xml

  # 门禁 15：编译时间监控（拆包收益量化 + 防回归）
  # 首次运行（基线不存在）→ 保存基线；之后 → 与基线对比，超阈值仅 warning 不阻塞
  compile-time:
    name: Compile Time Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure and compare compile time
        run: bash scripts/check-compile-time.sh --threshold-percent=50 || true
      - name: Upload timings artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/

  # 门禁 16：Miri 内存/UB 检测（规则支撑：内存泄漏盲区）
  # 对纯逻辑 facade-tests 跑 miri；依赖不兼容时允许失败（continue-on-error）
  miri:
    name: Miri (UB + memory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on facade integration tests
        run: cargo +nightly miri test -p sz-rust-facade-tests --jobs 1
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  # 门禁 17：Windows 兼容性验证
  # 规避 rustc STATUS_STACK_BUFFER_OVERRUN bug：强制 CARGO_INCREMENTAL=0
  # 见 .trae/rules/project_rules.md 铁律 2（异步运行时）
  windows:
    name: Windows Compatibility
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        shell: bash
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace compiles (CARGO_INCREMENTAL=0)
        run: cargo check --workspace --all-targets
      - name: Run lib tests (no integration)
        run: cargo test --workspace --lib --jobs 1

  # 门禁 18：AI Facade 专项检查（--features all-providers）
  ai-facade:
    name: AI Facade (all-providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test with all-providers feature
        run: cargo test -p sz-rust-ai-facade --features all-providers
      - name: Clippy with all-providers feature
        run: cargo clippy -p sz-rust-ai-facade --features all-providers -- -D warnings
      - name: Doc with all-providers feature
        run: cargo doc -p sz-rust-ai-facade --features all-providers --no-deps

  # 门禁 19：文档-代码一致性（规则 23 支撑，防幻影交付）
  # 扫描 README/CHANGELOG/docs 声称的 sz-rust-* crate，必须存在于 workspace
  # 历史幻影声称（企业版交付）降级 WARN，清单外新增声称 ERROR 构建失败
  doc-code-consistency:
    name: Doc-Code Consistency (no phantom delivery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check claimed crates exist in workspace
        run: node scripts/audit/doc-code-consistency.js

  # 门禁 20：ADR-代码对账（规则 14 支撑，ADR 引用代码必须存在）
  # 替换原 adr-coverage job 内嵌的"代码行号引用检查"步骤，独立为脚本
  adr-code:
    name: ADR Code Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR code references exist
        run: node scripts/audit/adr-code-consistency.js

  # 门禁 21：测试断言价值（规则 10/23 支撑，拒绝无断言的行覆盖）
  # 无断言且无 unwrap/expect 的测试 = 覆盖率空洞，无论实现多正确都会"通过"
  assertion-value:
    name: Assertion Value (no empty tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tests have assertions
        run: node scripts/audit/assertion-value-check.js

  # 门禁 22：配置-代码一致性（feature 声明 vs 源码引用）
  # 源码引用的 feature 未声明 = 永远不可启用（死代码）；声明的死 feature 提示清理
  feature-consistency:
    name: Feature Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check feature declarations match source
        run: node scripts/audit/feature-consistency.js
