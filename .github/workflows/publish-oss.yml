name: Publish OSS

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Check license compliance
        run: python scripts/check_license_compliance.py --project-root .

      - name: Verify publish readiness
        run: cargo publish --dry-run -p sz-rust-core

      - name: Publish sz-rust-core
        run: cargo publish -p sz-rust-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish sz-rust-capability
        run: cargo publish -p sz-rust-capability
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish sz-rust-ai-facade
        run: cargo publish -p sz-rust-ai-facade
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish sz-rust-rag
        run: cargo publish -p sz-rust-rag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish sz-rust-mcp
        run: cargo publish -p sz-rust-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish remaining crates
        run: |
          for pkg in sz-rust-http-facade sz-rust-cache-facade sz-rust-state-facade \
                     sz-rust-infra-facade sz-rust-auth-facade sz-rust-pay-facade \
                     sz-rust-orm-facade sz-rust-orm-ext-facade sz-rust-router-facade \
                     sz-rust-middleware-facade sz-rust-mvc-facade sz-rust-macros \
                     sz-rust-cli sz-rust-frontend-codegen sz-rust-workflow; do
            cargo publish -p "$pkg" || echo "Skip $pkg (may already be published)"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: false