name: Publish OSS

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.2.0)'
        required: true
        type: string
      dry_run:
        description: '仅预览不实际发布'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # CI 不使用 sccache（runner 未安装，.cargo/config.toml 的 rustc-wrapper 会导致
  # cargo metadata/metadata 类门禁报 "could not execute process sccache"，
  # 与 ci.yml / .githooks/pre-commit 的降级逻辑一致）
  RUSTC_WRAPPER: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm

      - uses: dtolnay/rust-toolchain@stable

      - name: Set publish flag
        id: publish-flag
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # 合规检查门禁（发布前必跑）
      - name: Isolation check (oss)
        run: python scripts/check_isolation.py --project-root . --repo-type oss

      - name: License compliance check
        run: python scripts/check_license_compliance.py --project-root . --mode all --expected-license Apache-2.0

      - name: No crate-level allow(dead_code) check
        run: python scripts/check_no_crate_level_allow_dead_code.py --project-root .

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Cargo deny check licenses
        run: cargo deny check licenses

      # sz-rust-visual 依赖 Tauri，Linux 侧构建需要系统库（glib/gtk/webkit，
      # 与 visual-build.yml 的安装清单一致）；缺失时 glib-sys 构建脚本失败
      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run workspace tests
        run: cargo test --workspace

      # 发布 30 个开源 crate（按依赖拓扑序）
      - name: Publish sz-rust-macros
        run: cargo publish ${{ steps.publish-flag.outputs.flag }} -p sz-rust-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish sz-rust-core
        run: cargo publish ${{ steps.publish-flag.outputs.flag }} -p sz-rust-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish facades and utils
        run: |
          for pkg in \
            sz-rust-capability \
            sz-rust-observability \
            sz-rust-tracing \
            sz-rust-http-facade \
            sz-rust-cache-facade \
            sz-rust-state-facade \
            sz-rust-infra-facade \
            sz-rust-auth-facade \
            sz-rust-pay-facade \
            sz-rust-orm-facade \
            sz-rust-orm-ext-facade \
            sz-rust-router-facade \
            sz-rust-middleware-facade \
            sz-rust-mvc-facade \
            sz-rust-ai-facade \
            sz-rust-addons-loader \
            sz-rust-pdf \
            sz-rust-workflow \
            sz-rust-rag \
            sz-rust-wasm \
            sz-rust-vector-db \
            sz-rust-frontend-codegen \
            sz-rust-mcp \
            sz-rust-cli; do
            cargo publish ${{ steps.publish-flag.outputs.flag }} -p "$pkg" || echo "Skip $pkg"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish examples and test crates
        run: |
          for pkg in sz-rust-examples sz-rust-facade-tests; do
            cargo publish ${{ steps.publish-flag.outputs.flag }} -p "$pkg" || echo "Skip $pkg"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
