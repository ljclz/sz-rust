# Release workflow — tag 触发的发布流程
#
# 触发条件：推送 v*.*.* 格式的 tag（如 v0.3.0）
# 工作流：
#   1. 跑全部测试（确保发布质量）
#   2. 构建 release 二进制（多平台：linux amd64 / arm64）
#   3. 生成 CHANGELOG（基于 commit 历史）
#   4. 创建 GitHub Release，上传二进制 + SHA256 校验和
#   5. 构建并推送 Docker 镜像到 GHCR（GitHub Container Registry）

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR 镜像

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========== Job 1: 测试 ==========
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run all tests
        run: cargo test --workspace --all-targets --jobs 1
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run cargo-deny
        run: cargo deny check advisories licenses bans sources

  # ========== Job 2: 构建多平台二进制 ==========
  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p sz-rust-sz300
      - name: Package binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ARCHIVE="sz300-server-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release sz300-server
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sz300-server-${{ matrix.target }}
          path: |
            sz300-server-*.tar.gz
            sz300-server-*.sha256

  # ========== Job 3: 创建 GitHub Release ==========
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于生成 CHANGELOG
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate CHANGELOG
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Release ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Artifacts
            - `sz300-server-*-x86_64-unknown-linux-gnu.tar.gz` — Linux x86_64 二进制
            - `sz300-server-*-aarch64-unknown-linux-gnu.tar.gz` — Linux ARM64 二进制
            - `*.sha256` — SHA256 校验和

            ### Install
            ```bash
            VERSION=${{ github.ref_name }}
            wget https://github.com/ljclz/sz-rust/releases/download/$VERSION/sz300-server-$VERSION-x86_64-unknown-linux-gnu.tar.gz
            tar -xzf sz300-server-$VERSION-x86_64-unknown-linux-gnu.tar.gz
            ./sz300-server
            ```
          files: |
            artifacts/*/sz300-server-*.tar.gz
            artifacts/*/sz300-server-*.sha256
          draft: false
          prerelease: false

  # ========== Job 4: 构建并推送 Docker 镜像 ==========
  docker:
    name: Push Docker image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sz300-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sz300-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
