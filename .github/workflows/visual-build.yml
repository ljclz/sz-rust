# SZ-Rust 画布跨平台构建 CI
#
# 三端矩阵：Windows (msi) / macOS (dmg) / Linux (deb + AppImage)

name: Visual Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: msi
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: deb

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: packages/sz-rust-visual/frontend
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Build Tauri app
        working-directory: packages/sz-rust-visual
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          # 代码签名证书（通过 CI secrets 注入）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sz-rust-visual-${{ matrix.platform }}
          path: |
            packages/sz-rust-visual/target/${{ matrix.target }}/release/bundle/**/*.msi
            packages/sz-rust-visual/target/${{ matrix.target }}/release/bundle/**/*.dmg
            packages/sz-rust-visual/target/${{ matrix.target }}/release/bundle/**/*.deb
            packages/sz-rust-visual/target/${{ matrix.target }}/release/bundle/**/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true