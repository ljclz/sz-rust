name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 先检出兄弟仓库再跑 rust-cache：rust-cache 会执行 cargo metadata 推导 target 目录，
      # Cargo.toml 的 path = "../sz-orm/..." 缺失时该命令以 101 退出，缓存判定失真。
      - name: Checkout sz-orm dependency
        run: |
          git clone https://github.com/ljclz/sz-orm.git ../sz-orm
          git -C ../sz-orm checkout "$(cat .sz-orm-commit)"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # P1-6 基准覆盖门禁：校验 11 类基准存在（v0.3.3 扩展，超出 7 类最低要求）
      # 基准类别：route_matching / handler_ref_parse / route_config / json_serialization
      #           capitalize_first / json_dto / middleware_chain / di_container
      #           framework_vs_native / rate_limiting / circuit_breaker
      - name: Verify benchmark coverage (>= 11 categories)
        run: |
          set -euo pipefail
          LISTING=$(cargo bench --package sz-rust-core --bench core_bench -- --list 2>&1)
          echo "$LISTING"
          REQUIRED=(
            "route_matching"
            "handler_ref_parse"
            "route_config"
            "json_serialization"
            "capitalize_first"
            "json_dto"
            "middleware_chain"
            "di_container"
            "framework_vs_native"
            "rate_limiting"
            "circuit_breaker"
          )
          MISSING=0
          for NAME in "${REQUIRED[@]}"; do
            if echo "$LISTING" | grep -q "$NAME"; then
              echo "✅ $NAME present"
            else
              echo "❌ $NAME MISSING"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::Missing $MISSING benchmark groups (required >= 11 categories)"
            exit 1
          fi
          echo "✅ All 11 benchmark groups present (exceeds 7-category minimum)"

      # SDET P1-5：PR 从 gh-pages-bench 分支恢复上次保存的 criterion 基线数据，
      # 使 --baseline 可用；无基线（首次运行）时降级为 save-baseline
      - name: Restore baseline criterion data (PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin gh-pages-bench 2>/dev/null || echo "no gh-pages-bench branch yet"
          if git rev-parse --verify origin/gh-pages-bench >/dev/null 2>&1; then
            git checkout origin/gh-pages-bench -- target/criterion/
            echo "BASELINE_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "baseline restored from gh-pages-bench"
          else
            echo "BASELINE_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "no baseline available, will save new baseline"
          fi

      - name: Run benchmarks
        run: |
          if [ "$BASELINE_AVAILABLE" = "1" ]; then
            cargo bench --package sz-rust-core --bench core_bench -- \
              --warm-up-time 1 --measurement-time 3 --sample-size 30 \
              --baseline v0.3.3
          else
            cargo bench --package sz-rust-core --bench core_bench -- \
              --warm-up-time 1 --measurement-time 3 --sample-size 30 \
              --save-baseline v0.3.3
          fi

      # SDET P1-5：性能回归门禁接线（原 workflow 只保存基线/上传报告，从不判定回归）
      # 与 v0.3.3 基线对比，任一基准组延迟增加 >10% → exit 1 阻塞 PR
      - name: Performance regression gate
        if: github.event_name == 'pull_request' && env.BASELINE_AVAILABLE == '1'
        run: bash scripts/perf/regression_gate.sh v0.3.3 10

      # SDET 门禁 30 配套：runtime_perf（10 个 #[ignore] 性能测试，宽松阈值）
      # 随基准 workflow 执行，避免 ignored 测试脱离执行
      - name: Run runtime_perf ignored tests
        run: |
          cargo test --package sz-rust-core --test runtime_perf -- --ignored --test-threads=1

      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 30

      - name: Save benchmark results to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-bench
          git add -f target/criterion/
          git commit -m "Update benchmark results for ${{ github.sha }}"
          git push origin gh-pages-bench --force
