name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Checkout sz-orm dependency
        run: git clone https://github.com/ljclz/sz-orm.git ../sz-orm

      - name: Run benchmarks
        run: |
          cargo bench --package sz-rust-core --bench core_bench -- \
            --warm-up-time 1 --measurement-time 3 --sample-size 30 \
            ${{ github.event_name == 'pull_request' && '--baseline v0.1.0' || '--save-baseline v0.1.0' }}

      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 30

      - name: Save benchmark results to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-bench
          git add -f target/criterion/
          git commit -m "Update benchmark results for ${{ github.sha }}"
          git push origin gh-pages-bench --force
