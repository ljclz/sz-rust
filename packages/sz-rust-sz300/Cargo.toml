[package]
name = "sz-rust-sz300"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-Rust sz300 业务应用 — 设备/商户/商品/订单管理示例"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# sz-orm 穿透依赖已迁移至 sz-rust-core::orm facade（v0.2.0+）
# 保留的直接依赖：
#   - sz-orm-sqlx：SQLx 后端实现（sz-rust-core 不提供）
sz-rust-core.workspace = true
# C4 验证：业务包 facade 直连（类型与 core re-export 同一，可逐步替换 sz_rust_core:: 引用）
sz-rust-mvc-facade.workspace = true
sz-rust-middleware-facade.workspace = true
sz-rust-http-facade.workspace = true
sz-rust-state-facade.workspace = true
sz-rust-observability.workspace = true
sz-orm-sqlx.workspace = true
# 直接依赖 sqlx 仅为配置底层 MySQL 连接池容量（max_connections 需与 sz-orm Pool.max_size 对齐）。
# features 取 sz-orm-sqlx 的子集，Cargo 按并集解析，与 sz-orm-sqlx 共享同一编译产物，不增加主包体积。
sqlx = { workspace = true, features = ["mysql"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
axum.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
bcrypt.workspace = true
once_cell.workspace = true
# v1.9.0 JWT Audience 注入 aud 声明需 HMAC-SHA256 重签名（feature gate 控制）
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# v1.8.0 安全头中间件（feature gate 控制，默认不启用）
sz-rust-security-headers = { workspace = true, optional = true }
# v1.8.0 数据脱敏中间件（feature gate 控制，默认不启用）
sz-rust-data-mask = { workspace = true, optional = true }
# v1.8.0 RBAC 细粒度权限（feature gate 控制，默认不启用）
sz-rust-auth-facade = { workspace = true, optional = true, features = ["rbac"] }
# v1.8.0 JWT 密钥轮换（feature gate 控制，默认不启用）
sz-rust-key-rotation = { workspace = true, optional = true }
# v1.8.0 文件上传增强（feature gate 控制，默认不启用）
sz-rust-upload = { workspace = true, optional = true }
# v1.8.0 GraphQL 端点（feature gate 控制，默认不启用）
async-graphql = { workspace = true, optional = true, features = ["dataloader"] }
async-graphql-axum = { workspace = true, optional = true }
# v1.8.0 WebSocket 端点（feature gate 控制，默认不启用）
sz-rust-websocket = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# v1.8.0 SSE 端点（feature gate 控制，默认不启用）
# 使用 axum 内置 SSE 支持，无需额外依赖
# v1.9.0 Saga 分布式事务（feature gate 控制，默认不启用）
sz-rust-distributed-tx = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# v1.9.0 可观测性闭环（feature gate 控制，默认不启用）
sz-rust-alert-engine = { workspace = true, optional = true }


[features]
default = []
# Addon 热加载：运行时动态加载 .dll/.so/.dylib 插件（libloading 后端）
# 启用后，启动时自动扫描 addons/ 目录并加载所有共享库
hot-reload = ["sz-rust-core/hot-reload"]
real-broker = ["sz-rust-core/real-broker"]
# 启用 OTLP gRPC 分布式追踪导出（需要 OpenTelemetry Collector，端口 4317）
otlp = ["sz-rust-observability/otlp"]
# 启用 OTLP HTTP/protobuf 分布式追踪导出（端口 4318）
otlp-http = ["sz-rust-observability/otlp-http"]
# v1.8.0 安全头中间件接入
v18-security-headers = ["dep:sz-rust-security-headers"]
# v1.8.0 数据脱敏中间件接入
v18-data-mask = ["dep:sz-rust-data-mask"]
# v1.8.0 RBAC 细粒度权限接入
v18-rbac = ["dep:sz-rust-auth-facade"]
# v1.8.0 JWT 密钥轮换接入
v18-key-rotation = ["dep:sz-rust-key-rotation"]
# v1.8.0 审计链式哈希接入
v18-audit-chain = ["sz-rust-middleware-facade/audit-chain"]
# v1.8.0 文件上传增强接入
v18-upload = ["dep:sz-rust-upload"]
# v1.8.0 GraphQL 端点接入
v18-graphql = ["dep:async-graphql", "dep:async-graphql-axum"]
# v1.8.0 WebSocket 端点接入
v18-websocket = ["dep:sz-rust-websocket", "dep:futures"]
# v1.8.0 SSE 端点接入
v18-sse = ["dep:futures"]
# v1.9.0 GraphQL 持久化（DB-backed schema）
v19-graphql-persist = ["v18-graphql"]
# v1.9.0 JWT Audience 安全增强
v19-jwt-audience = ["dep:hmac", "dep:sha2"]
# v1.9.0 Saga 分布式事务接入订单
v19-saga = ["dep:sz-rust-distributed-tx", "dep:async-trait"]
# v1.9.0 AI 智能分类接入商品管理
v19-ai-classify = ["dep:async-trait"]
# v1.9.0 国际化接入 sz300
v19-i18n = []
# v1.9.0 配置中心动态配置
v19-config-center = []
# v1.9.0 可观测性闭环
v19-obs-closure = ["dep:sz-rust-alert-engine", "dep:sz-rust-data-mask"]
# v1.9.0 插件生态落地
v19-plugin-flow = []
# v1.9.0 聚合 feature
all-v1-9 = ["v19-graphql-persist", "v19-jwt-audience", "v19-saga", "v19-ai-classify", "v19-i18n", "v19-config-center", "v19-obs-closure", "v19-plugin-flow"]

[[bin]]
name = "sz300-server"
path = "src/main.rs"

[[bench]]
name = "api_bench"
harness = false

[[bench]]
name = "hot_path"
harness = false

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
futures.workspace = true
tower = { workspace = true }
http-body-util = { workspace = true }
