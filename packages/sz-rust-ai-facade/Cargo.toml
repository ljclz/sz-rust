[package]
name = "sz-rust-ai-facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AI facade for sz-rust — LLM/Embedding/RAG/Agent unified abstraction"
repository.workspace = true
homepage.workspace = true
autobenches = false
keywords = ["ai", "llm", "rag", "agent", "thinkphp"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
parking_lot = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
arc-swap = "1"
tiktoken-rs = { version = "0.5", optional = true }


# sz-rust 内部 facade 依赖
sz-rust-http-facade = { workspace = true }
sz-rust-mcp = { workspace = true }
sz-rust-observability = { workspace = true }
sz-rust-capability = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "ai_facade_bench"
harness = false

[[bin]]
name = "generate_baseline_report"
path = "benches/generate_baseline_report.rs"

[features]
default = []
# OpenAI Provider
openai = []
# Claude Provider
claude = []
# Gemini Provider
gemini = []
# 全部 Provider
all-providers = ["openai", "claude", "gemini"]
# 真实 API 测试（需要 API Key + 网络）
real-api = ["openai"]
# tiktoken 精确 token_count
tiktoken = ["dep:tiktoken-rs"]
# 本地模型加载验证
local-model = []
# RAG 重排序（CrossEncoderReranker，Cohere API）
reranker = []
# RAG 混合检索（BM25 + 向量 RRF 融合）
hybrid = []

[package.metadata.cargo-udeps.ignore]

development = ["proptest"]

[lints]
workspace = true