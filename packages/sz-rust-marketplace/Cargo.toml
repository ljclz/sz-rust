[package]
name = "sz-rust-marketplace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-Rust 插件市场 — 清单管理、Ed25519 签名、对象存储、审核流程、Web API、CLI 客户端"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sz_rust_marketplace"

[dependencies]
# SZ-Rust 内部依赖
sz-rust-addons-loader = { workspace = true }
sz-rust-capability = { workspace = true }
sz-rust-core = { workspace = true }

# 数据库
sqlx = { workspace = true }

# 异步运行时
tokio = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# 错误与工具
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
# 签名与校验
ed25519-dalek = { workspace = true }
semver = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# HTTP 客户端
reqwest = { workspace = true }
# 异步 trait
async-trait = { workspace = true }
bytes = { workspace = true }
# Web 框架
axum = { workspace = true }
# OpenAPI 文档
utoipa = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"