#
# SZ-Rust 插件市场 Docker Compose 编排
#
# 三个服务：
#   marketplace-web — axum Web API（多阶段构建，distroless 基础镜像）
#   postgres-14     — PostgreSQL 14 持久化数据库
#   minio           — S3 兼容对象存储
#
# 启动：docker compose -f packages/sz-rust-marketplace/docker-compose.yml up -d
# 验证：curl http://localhost:8080/api/v1/plugins/search?q=test
# 清理：docker compose -f packages/sz-rust-marketplace/docker-compose.yml down -v
#
# 安全整改（2026-10-28）：数据库/对象存储/JWT 凭据默认仅用于本地开发，
# 生产环境必须通过环境变量覆盖（MARKETPLACE_DB_PASSWORD / MINIO_ROOT_PASSWORD / MARKETPLACE_JWT_SECRET）。

services:
  marketplace-web:
    build:
      context: ../..
      dockerfile: packages/sz-rust-marketplace/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://szrust:${MARKETPLACE_DB_PASSWORD:-szrust}@postgres-14:5432/szrust_marketplace"
      OBJECT_STORE_ENDPOINT: "http://minio:9000"
      OBJECT_STORE_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      OBJECT_STORE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      OBJECT_STORE_BUCKET: "plugins"
      JWT_SECRET: "${MARKETPLACE_JWT_SECRET:-sz-rust-marketplace-jwt-secret-change-in-production}"
      ED25519_PUBLIC_KEY: "${ED25519_PUBLIC_KEY:-}"
      RUST_LOG: "info"
    depends_on:
      postgres-14:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres-14:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: szrust
      POSTGRES_PASSWORD: "${MARKETPLACE_DB_PASSWORD:-szrust}"
      POSTGRES_DB: szrust_marketplace
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szrust -d szrust_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  pg-data:
  minio-data: