[package]
name = "sz-rust-sdd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-Rust SDD Agent — Spec-Driven Development 四阶段编排引擎"
repository.workspace = true
homepage.workspace = true
keywords = ["sdd", "agent", "ai", "code-generation", "specification"]
categories.workspace = true

[dependencies]
sz-rust-ai-facade = { workspace = true, features = ["all-providers", "tiktoken", "reranker", "hybrid", "local-model"] }
sz-rust-mcp = { workspace = true }
sz-rust-capability = { workspace = true }
sz-rust-rag = { workspace = true }
sz-rust-visual = { workspace = true }
tera = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
similar = "2"
anyhow = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true

[lib]
name = "sz_rust_sdd"
path = "src/lib.rs"

[[bin]]
name = "sdd"
path = "src/bin/sdd.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
sz-rust-capability = { workspace = true }