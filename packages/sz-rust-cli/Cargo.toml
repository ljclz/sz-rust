[package]
name = "sz-rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-Rust 命令行工具：项目脚手架、数据库迁移、调度器管理"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["docs/**"]

[dependencies]
# 命令行框架
clap.workspace = true
# 序列化
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
# 时间
chrono.workspace = true
# 错误
thiserror.workspace = true
# 异步运行时（migrate 在线模式需要）
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# SZ-ORM SQLx 驱动（在线迁移执行所需，启用 Oracle/MSSQL 多后端）
sz-orm-sqlx = { workspace = true, features = ["oracle", "mssql"] }
# SZ-ORM MSSQL 驱动（MSSQL TLS 配置需要直接访问 MssqlPoolHandle）
sz-orm-mssql = "7.6"
# SZ-ORM Oracle 驱动（绕过 AnyPool 避免 Runtime drop panic）
sz-orm-oracle = "7.6"
# SZ-Rust 核心（调度器封装，含 ORM facade）
sz-rust-core.workspace = true
# 模板引擎（P1-T3 插件模板库）
tera.workspace = true
# 交互式命令行输入（P1-T3 插件模板库）
dialoguer.workspace = true
# 前端代码生成（P4-T1 CLI make:frontend 子命令）
sz-rust-frontend-codegen = { workspace = true }
# 插件市场客户端（P2-2 CLI 接线）
sz-rust-marketplace = { workspace = true }
# CLI 表格输出
tabled.workspace = true
# CLI 进度条
indicatif.workspace = true
# HTTP 客户端（MarketplaceClient）
reqwest.workspace = true
# 异步 trait
async-trait.workspace = true
# Admin 插件（admin migrate/init 命令 + serve --with-admin 接线）
sz-rust-addons-admin = { workspace = true }
# 插件加载器（CapabilityHook trait）
sz-rust-addons-loader = { workspace = true }
# Capability 注册表（serve --with-admin 注册 admin.* 能力）
sz-rust-capability = { workspace = true }
# ORM facade（serve --with-admin 创建 Pool）
sz-rust-orm-facade = { workspace = true }
# 中间件 facade（serve --with-data-scope 数据权限中间件）
sz-rust-middleware-facade = { workspace = true }
# HTTP 路由（serve 命令构建 Router）
axum.workspace = true
# 日志（serve 命令输出启动信息）
tracing.workspace = true
# 密码哈希（admin init 命令）
bcrypt = "0.15"
# 配置热重载（serve --watch-config）
notify = { workspace = true }


[dev-dependencies]
tempfile.workspace = true
mockito = "1"
tower = { workspace = true }
http = "1"
http-body-util = "0.1"
sz-rust-orm-facade = { workspace = true }
sqlx = { workspace = true }

sz-rust-addons-loader = { workspace = true }
async-trait.workspace = true

[lib]
name = "sz_rust_cli"
path = "src/lib.rs"

[[bin]]
name = "sz-rust"
path = "src/main.rs"
