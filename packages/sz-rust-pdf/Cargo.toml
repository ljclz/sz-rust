[package]
name = "sz-rust-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-Rust PDF/Excel 处理模块：对齐 PHP phpspreadsheet + php-pdftk"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# 内部依赖
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# Excel 导出（替代 PHP phpspreadsheet 写入）— 对齐 PHP `new Spreadsheet()` / `setCellValue` / `setTitle` / `getColumnDimension->setWidth` / `IOFactory::createWriter` / `save`
rust_xlsxwriter.workspace = true

# Excel 导入（替代 PHP phpspreadsheet 读取）— 对齐 PHP `IOFactory::identify` / `createReader` / `load` / `getSheet(0)` / `toArray`
calamine.workspace = true

# PDF 表单填充（替代 PHP mikehaertl/php-pdftk）— 对齐 PHP `new Pdf($path)` / `fillForm($data)` / `flatten()` / `saveAs($url)` / `send($filename)`
lopdf.workspace = true

# HTTP 客户端（替代 PHP cURL）— 对齐 PHP `http_java_post` 全局函数
reqwest = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }

[lib]
name = "sz_rust_pdf"
path = "src/lib.rs"

[package.metadata.cargo-machete]
ignored = ["serde"]
