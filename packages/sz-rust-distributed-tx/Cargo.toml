[package]
name = "sz-rust-distributed-tx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Distributed transactions for sz-rust — Saga + TCC orchestration + compensation + state persistence"
repository.workspace = true
homepage.workspace = true
keywords = ["saga", "tcc", "distributed-tx", "compensation", "thinkphp"]
categories = ["asynchronous"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { workspace = true }

[features]
dtx-parallel = ["dep:futures"]

[[bench]]
name = "parallel_saga"
harness = false
required-features = ["dtx-parallel"]

[lints]
workspace = true