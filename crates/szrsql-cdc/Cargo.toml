[package]
name = "szrsql-cdc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SzRSQL 变更数据捕获：WAL → 事件流"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
szrsql-types = { workspace = true }
szrsql-tx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
# P7-2：真实 PostgreSQL 驱动（默认启用，使用 rust-postgres 同步客户端）
# 选型理由：
# - SourceConnector/TargetWriter trait 为同步接口，与 rust-postgres 同步 API 天然契合
# - rust-postgres 是 Rust 生态最成熟的 PG 客户端，无需 tokio runtime
# - 已在 dev-dependencies 中验证可用（integration_pg.rs）
# - 启用 with-serde_json-1 特性以支持 JSONB 列的 FromSql 转换
# - 启用 with-chrono-0_4 特性以支持 DATE/TIMESTAMP 列的 FromSql 转换
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
# P8-4 安全加固：API Key 随机生成（256 bit 熵）
rand = { workspace = true }
# P0-6：Mutex/RwLock 中毒修复（parking_lot 无中毒语义，避免 .unwrap() 级联 panic）
parking_lot = { workspace = true }

# P0-1：真实数据库驱动（按需启用，通过 feature flag 控制）
# MySQL：纯 Rust 实现，无 C 库依赖
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio"], optional = true }
# SQL Server：纯 Rust TDS 客户端
tiberius = { version = "0.12", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
# Oracle：需要 Oracle Instant Client C 库
oracle = { version = "0.6", optional = true }
# Kafka：需要 librdkafka C 库
rdkafka = { version = "0.36", optional = true }

[dev-dependencies]
# 测试专用：临时目录、并发测试工具
tempfile = { workspace = true }

[features]
default = []
# 启用 loom 并发模型测试（cargo test --features loom_model）
loom_model = []
# P0-1：真实数据库驱动集成（按需启用，避免默认引入 C 库依赖）
# PostgreSQL 真实驱动默认启用（复用已存在的 postgres workspace 依赖，纯 Rust）
# MySQL：启用 sqlx 依赖（纯 Rust，无 C 库）
real-mysql = ["sqlx"]
# SQL Server：启用 tiberius + tokio-util 依赖（纯 Rust，无 C 库）
real-sqlserver = ["tiberius", "tokio-util"]
# Oracle：启用 oracle 依赖（需要 Oracle Instant Client C 库）
real-oracle = ["oracle"]
# Kafka：启用 rdkafka 依赖（需要 librdkafka C 库）
real-kafka = ["rdkafka"]
# 启用所有真实驱动（需要所有 C 库依赖）
real-drivers = ["real-mysql", "real-sqlserver", "real-oracle", "real-kafka"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
