[package]
name = "szrsql-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SzRSQL SQL 解析器与执行器"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
szrsql-types = { workspace = true }
szrsql-tx = { workspace = true }
szrsql-storage = { workspace = true }
szrsql-dist = { workspace = true }
szrsql-cdc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
sqlparser = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
# P4-4：UNICODE NORMALIZE 函数
unicode-normalization = { workspace = true }
tracing = { workspace = true }
# P0-6：Mutex 中毒修复（parking_lot 无中毒语义）
parking_lot = { workspace = true }
# P2-18：查询并行化（多线程并行扫描/排序/聚合）
rayon = { workspace = true }

[dev-dependencies]
# 差分比对测试：连接本地 PG 18 进行结果集比对
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
chrono = { workspace = true }
tempfile = { workspace = true }
