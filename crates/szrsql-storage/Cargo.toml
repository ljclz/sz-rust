[package]
name = "szrsql-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SzRSQL 存储引擎：Page/BufferPool/B-Tree/LSM"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
szrsql-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
crc32c = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
ureq = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tracing = { workspace = true }
# P0-6：Mutex/RwLock 中毒修复（parking_lot 无中毒语义，避免 .unwrap() 级联 panic）
parking_lot = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
loom = { workspace = true }

[features]
default = []
# 启用 loom 并发模型测试（cargo test --features loom_model）
loom_model = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
