[package]
name = "szrsql-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SzRSQL 协议层：PG Wire/REST/WebSocket"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
szrsql-types = { workspace = true }
szrsql-sql = { workspace = true }
szrsql-catalog = { workspace = true }
szrsql-tx = { workspace = true }
szrsql-dist = { workspace = true }
szrsql-cdc = { workspace = true }
szrsql-optimizer = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Phase 4.12：崩溃日志时间戳（ISO 8601 格式）
chrono = { workspace = true }

# Phase 4.13：进程守护化 + PID 文件（平台特定依赖）
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
# Phase 4.5：rustls 0.23+ 中 dangerous API 默认可用（无需 feature flag）
rustls = { workspace = true }
# Phase 4.10：Rust sqlx 驱动验证（仅测试用，features 最小化以避免编译负担）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
